# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Cardiovascular and pulmonary disease risk factors in Hispanic/Latino populations"
  design: "Multi-center, community-based prospective cohort with probability sampling"
  population: "~16,415 Hispanic/Latino adults aged 18-74, diverse heritage groups"
  key_strengths: 
    - "Largest and most comprehensive study of Hispanic/Latino health in the US"
    - "Diverse heritage group representation (Cuban, Dominican, Mexican, Puerto Rican, Central/South American)"
    - "Bilingual (English/Spanish) data collection protocols"
    - "Probability sampling design enabling population-level estimates"
    
harmonization_considerations:
  - "Complex race/ethnicity and heritage group coding vs. broad categories"
  - "Probability sampling design requiring appropriate weighting"
  - "Bilingual data collection with potential language-related variations"
  - "Ethnic-specific reference ranges and clinical thresholds"
