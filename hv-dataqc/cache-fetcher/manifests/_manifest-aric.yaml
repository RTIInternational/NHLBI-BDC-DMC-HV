# =============================================================================
study_characteristics:
  focus: "Atherosclerosis risk factors and cardiovascular disease in community populations"
  design: "Prospective longitudinal cohort across four US communities"
  population: "~15,792 adults aged 45-64 at baseline, biracial community-based cohort"
  key_strengths: 
    - "Large community-based cohort with extensive cardiovascular phenotyping"
    - "Multi-site design with standardized protocols"
    - "Community surveillance for cardiovascular events"
    - "30+ years of longitudinal follow-up"
    
harmonization_considerations:
  - "Multi-site protocol standardization across four field centers"
  - "Biracial design with Jackson MS site as African American cohort"
  - "Temporal protocol changes across study visits"
  - "Event adjudication and classification methodology"
