# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Cardiovascular disease risk factors and outcomes in African Americans"
  design: "Single-site prospective longitudinal cohort in Jackson, Mississippi"
  population: "~5,306 African American adults aged 21-84"
  key_strengths: 
    - "Largest single-site epidemiologic study of CVD in African Americans"
    - "Deep cardiovascular phenotyping with echocardiography and cardiac CT"
    - "Unique psychosocial, discrimination, and community context measures"
    - "ARIC Jackson site overlap enabling cross-study linkage"
    
harmonization_considerations:
  - "Single-race (African American) cohort design"
  - "ARIC Jackson site participant overlap (~30% shared)"
  - "Population-specific clinical thresholds and reference ranges"
  - "Unique psychosocial and discrimination variables"
