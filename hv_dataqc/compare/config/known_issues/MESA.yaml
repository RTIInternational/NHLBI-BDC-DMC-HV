  - checks: [C4, C6]
    variable_key: "fgvgreenleafy5c"
    yaml_file: vege_serving.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      vege_serving.yaml computes weekly green leafy vegetable servings as
      the sum of 7 sub-component PHVs (phv00218787 through phv00218793) * 7.
      The crosswalk maps to fgvgreenleafy5c (pre-computed daily summary,
