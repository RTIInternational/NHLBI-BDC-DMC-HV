  # =========================================================================
  # C2/C3 — Structural harmonized-side undercounts from plain MeasurementObservation
  #         blocks whose method_type is dropped by the extract_harmonized process.
  #
  #   Root cause: extract_harmonized_summaries.py:process_measurements()
  #   (lines ~307-408) groups the MeasurementObservation.tsv only by
  #   observation_type. method_type is NOT part of the group key.
  #   In contrast, process_measurement_observation_sets() (line 541+)
  #   groups nested observations by (observation_type, method_type).
  #
  #   Effect: any YAML block that produces plain MeasurementObservation
  #   entities (not wrapped in a MeasurementObservationSet) contributes to
  #   the bare `measurement_<concept>` harmonized key but is invisible to
  #   the pipe-delimited `measurement_<concept>|<method_type>` key. When
  #   the yaml_crosswalk builder attributes the source PHVs by method_type
  #   (because the YAML block DOES declare method_type), the compare tool
  #   sees a mismatched source pool for a bucket the harmonized extractor
  #   never populated.
  #
  #   Evidence: harmonized bare `measurement_OMOP:4152194` has n_total=208,560,
  #   mean=138.7 mmHg, min=29, max=255 — clinically plausible SBP data from
  #   the plain-MO BP/ABI blocks. That data exists; only the method_type
  #   sub-bucket is missing.
  #
  #   Filed as hv-dataqc enhancement issue (see PR/issue linked in commit
  #   message). Do NOT rewrite the underlying ARIC YAML blocks — the
  #   observed cohort output is correct.
  # =========================================================================

