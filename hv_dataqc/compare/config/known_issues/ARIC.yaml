  # -- C2/C3: hraa28f+...+afucomp45_v1 (67.6% N loss, key type mismatch) ---
  - checks: [C2, C3]
    variable_key: "hraa28f+hfaa10d+hfaa16i+mhqa10a+afucomp45_v1"
    yaml_file: null
    status: known_issue
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      AFib/PE condition pool (condition_MONDO:0005279) from pht004053
      (hraa28f n=19,601), pht004102 (hfaa10d n=8,690, hfaa16i n=582),
      pht004125 (mhqa10a n=10,871), pht006416 (afucomp45_v1 n=82,947).
      67.6% N loss (122,691 -> 39,744); 432,042 null-status rows --
      check value_mappings key types.
      The dominant issue is pht006416 (ARIC V5 AFib composite indicator
      table, 82,947 rows) where the afucomp45_v1 variable has integer
      condition codes that do not match quoted string keys in the YAML
      value_mappings. Only ~40K rows survive (from the other 4 tables
      that may use string-encoded values or happen to match). With 432,042
      null-status rows out of 471,786 total harmonized rows, almost all
      pht006416 rows produce a condition row but with null condition_status.
      YAML fix needed: update value_mappings for the pht006416 block to
      use case(str()) or add integer code keys.
    confirmed_date: "2026-07-20"

  # -- C2/C3: ppfvc51/ppfev151/ppfev1fvc51 95.3% N loss (pht012814) --------
  - checks: [C2, C3]
    variable_key: "ppfvc51"
    yaml_file: null
    status: known_issue
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      ARIC Visit 5 percent-predicted spirometry variables (ppfvc51 = %
      predicted FVC, ppfev151 = % predicted FEV1, ppfev1fvc51 = FEV1/FVC)
      from pht012814 (DERIVE48, n=4,250/4,250/4,242 source valid) show
      95.3% N loss -> 200 rows in c1 or c2 consent group. Notably, C2
      also shows a PASS for the same variables at 4,250 (likely from the
      other consent group). This indicates pht012814 is available in one
      consent group (c2 likely) but nearly absent in the other (c1). The
      200 rows surviving in the failing group may be participants who appear
      in both consent groups. C3 and C9 FAILs for ppfvc51/ppfev151/ppfev1fvc51
      (min=0 below plausible 5, max=370/418 above red_flag 250) are
      secondary consequences: the 200 surviving rows may include sentinel
      values (0 = measurement not done) or extreme outliers from the small
      surviving subset. Re-investigate when all ARIC consent groups are
      processed together.
    confirmed_date: "2026-07-20"

  # -- C2: measurement_OBA:2041536 no YAML match ----------------------------
  - checks: [C2]
    variable_key: "measurement_OBA:2041536"
    yaml_file: null
    status: known_issue
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Harmonized measurement rows with observation_type=OBA:2041536 are
      present in the output but the source crosswalk has no corresponding
      pool entry attributing PHVs to this concept. This produces a C2 FAIL
      of "Harmonized variable not matched in source -- no YAML block
      proposed this concept." OBA:2041536 was not identified in the
      crosswalk table. Possible cause: the YAML maps some PHV to
      OBA:2041536 as observation_type but the crosswalk did not attribute
      that PHV to this concept (crosswalk attribution gap). Needs
      investigation to identify which YAML block uses OBA:2041536 and
      verify the crosswalk attribution is correct.
    confirmed_date: "2026-07-20"

  # -- C2: measurement_OMOP:4152194 sub-key matching artifact ---------------
  - checks: [C2]
    variable_key: "measurement_OMOP:4152194"
    yaml_file: null
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      The crosswalk has OMOP:4152194 as a concept key with multiple
      sub-keys (pipe-delimited: "measurement_OMOP:4152194|Seated
      random-zero average", "measurement_OMOP:4152194|ABI form
      measurement", etc. -- lines 73-84 of report). The C2 FAIL "not
      matched in source" occurs because the harmonized output may produce
      rows with the bare key "OMOP:4152194" that doesn't match any of the
      sub-keyed crosswalk entries. This is a hv-dataqc crosswalk key
      matching artifact: ABI/BP measurements from pht004027-029, 006414,
      and carotid distensibility from pht004229-230 are correctly mapped in
      the YAML; the sub-key split in the crosswalk just prevents C2 from
      recognizing them as matched. The underlying data IS present (same
      PHVs appear in the large C2 N loss FAILs above for anksbp and
      udta pools).
    confirmed_date: "2026-07-20"

  # -- C3: strc9+gender+pulb23+... sex/demography missing rate change --------
  - checks: [C3]
    variable_key: "strc9+gender+pulb23+pulp23+ecgra281+hhxb10+pfta02"
    yaml_file: demography.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Sex/demography variable pool (demog_sex concept) spans 14 PHTs from
      all ARIC visit tables. C3 missing rate change is a multi-table pool
      composition artifact: the source crosswalk sums non-null sex values
      across all 14 PHTs, while harmonized outputs one sex record per
      participant (deduplicated). The denominator difference (total source
      rows vs harmonized rows per participant) produces an apparent missing
      rate change. C2 PASSES for this pool (participant coverage preserved).
      Not a data quality issue.
    confirmed_date: "2026-07-20"

  # -- C3: lipd7a+chma16+inssiu01 missing rate change (multi-exam pool) -----
  - checks: [C3]
    variable_key: "lipd7a+chma16+inssiu01"
    yaml_file: null
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Insulin/lipid pool (measurement_OBA:2060174) from pht004051 (chma16
      = CHMA, Exam 1 blood chemistry), pht004063 (lipd7a = LIPD, Exam 4
      lipids), pht004124 (inssiu01 = ESMA04, Exam 1 insulin). C3 missing
      rate change 0.34% -> 13.02% (d=12.7%). The large missing rate
      increase in harmonized reflects multi-table pooling: the harmonized
      output combines measurements from three different exam tables with
      different missingness profiles. The harmonized pool includes rows
      from participants who only have data in ONE of the three tables,
      inflating the null count relative to the source crosswalk's per-table
      sum. C4 mean passes (OMOP:2060174 preserved), confirming no unit
      error. This is a pool composition artifact from cross-exam
      measurement merging.
    confirmed_date: "2026-07-20"

  # -- C9: anta04+antb01+antc2+antd2+pulb22+pulp22 weight max=415 ----------
  - checks: [C9]
    variable_key: "anta04+antb01+antc2+antd2+pulb22+pulp22"
    yaml_file: bdy_wgt.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Weight variables anta04 (phv00203154), antb01 (phv00203166),
      antc2 (phv00203176), antd2 (phv00203187) from ARIC Exams 1-4, plus
      pulb22/pulp22 spirometry variables. max=415 lbs above red_flag 350.
      This is a pre-existing source outlier (a participant weighing 415 lbs
      is clinically possible if extreme). No [out only] annotation expected
      since the bdy_wgt.yaml fix (sentinel guards for 'A', 'O', etc.) does
      not affect numeric outlier values. The weight sentinel fix resolves
      the crash issues but does not truncate extreme valid values. The
      pulb22/pulp22 contribution may also have extreme spirometry values.
      The 415 lb value is faithfully preserved from source.
    confirmed_date: "2026-07-20"

  # -- C9: sbp min=0 / max outliers (ABI/BP measurement sentinels) ----------
  - checks: [C9]
    variable_key: "sbpa22+sbpb22+sbpc23"
    yaml_file: null
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Multiple blood pressure / ABI pools from pht004192-195 (SBPA, SBPB,
      SBPC, SBPD = ARIC Visit 4 sitting blood pressure tables) show:
      min=0.0 (below red_flag 15-40 mmHg), and max=304 (above red_flag
