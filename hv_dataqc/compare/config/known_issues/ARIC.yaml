  # =========================================================================
  # C9 — Real unit-scale mismatch: FEV1/FVC ratio percentage vs decimal
  # =========================================================================

  - checks: [C9]
    variable_key: "pfta31+pftb31_and_related"
    yaml_file: null
    status: false_positive_dataqc_tool
    root_cause: clinical_ranges_ratio_unit_scale
    summary: >
      Multiple FEV1/FVC ratio pools fail C9 with max > red_flag 1.15:
        - pfta31+pftb31 max=100.0
        - fev1fvc1+fef_122 max=86.556
        - pulb41 max=78.0
        - pulp41 max=78.0
        - pulp27 min=0
        - pulp31 min=0
      Root cause: clinical_ranges.yaml defines the FEV1/FVC red_flag as
      1.15 (decimal ratio), but every ARIC spirometry PHV that emits this
      concept stores the value as a percentage (0-100 scale). Verified in
      var_reports:
        - phv00208824 (pfta31): min=0, max=100, mean=74.34, median=75.67
        - phv00516622 (pftb31): min=25.92, max=100, mean=74.44
      spirometry.yaml correctly labels these blocks with `unit: "%"`.
      OMOP/BDCHM convention for FEV1/FVC (LOINC 19926-5, OMOP 3011505)
      IS percentage (0-100). The YAML unit is correct; the
      hv-dataqc clinical_ranges.yaml threshold is incorrect. FIX in
      hv-dataqc: update clinical_ranges.yaml so ratio red_flags scale to
      the declared unit (or provide separate decimal-ratio vs
      percentage-ratio entries). Similar C9 min=0 violations on pfta24
      (FEF), pfta26 (FEV1), etc. also represent unit-aware sentinel
      thresholds; the source values are correct.
      NOTE: The C9 min=0 findings on pulp27 (FEV1 L), pulp31 (FVC L),
      pfta24 (FEF L/s) are the standard ARIC "test not performed" sentinel
      -- classified under `known_source_data_property` below.
    confirmed_date: "2026-07-23"

