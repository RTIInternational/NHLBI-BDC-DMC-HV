  # C2 — Real YAML bugs: pht006416 value_mappings key-type mismatch
  # =========================================================================

  - checks: [C2, C3]
    variable_key: "hraa28f+hfaa10d+hfaa16i+mhqa10a+afucomp45_v1"
    yaml_file: ven_thromb.yaml
    status: real_issue
    root_cause: value_mappings_wrong_codes
    fix_status: applied_pending_pr
    summary: >
      MONDO:0005279 (pulmonary embolism/DVT) pool shows 67.6% N loss
      (122,691 -> 39,744) and 432,042 null-status rows. Traced to the
      pht006416 block in ven_thromb.yaml, which uses
      `value_mappings: '0': ABSENT, '1': PRESENT` for phv00294793
      (AFUCOMP45_V1). Independent verification in the pht006416 var_report
      shows phv00294793 uses N/Y codes: 100,342 "N", 265 "Y" (total non-null
      100,607). The '0'/'1' keys never match any source row -> every
      pht006416 Condition record emits with condition_status = null.
      With ~437k rows in pht006416, this explains the 432k null-status
      count. FIX: change value_mappings to `'N': ABSENT, 'Y': PRESENT`
      (matching the pht004053/pht004102/pht004125 sibling blocks in the
      same file).
    evidence:
      - 'Data_dict: phs000280.v9.pht006416.v6.afucomposite31ps1.data_dict.xml (type=string)'
      - 'Var_report: phs000280.v9.pht006416.v6.p3.afucomposite31ps1.var_report.xml shows enum count=100,342 "N" + count=265 "Y"'
      - 'YAML: priority_variables_transform/ARIC-ingest/ven_thromb.yaml:112-130'
    confirmed_date: "2026-07-23"

