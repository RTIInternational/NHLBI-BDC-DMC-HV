      = UDTB) show 23.2% N loss (66,096 -> 50,758 and 66,097 -> 50,761).
      17,591 null-status rows each -- check value_mappings key types.
      Same root cause as the ABI pool above: integer source values in the
      carotid ultrasound distensibility tables do not match quoted string
      keys in YAML value_mappings. The affected PHVs are phv00215412-525
      from the UDTA04 and UDTB04 exam tables. YAML fix needed for the
      carotid distensibility blocks (case(str()) pattern).
      Source PHTs: pht004229 contributes 9,281+9,281+7,028 and
      pht004230 contributes 13,502+13,502+13,502 = 65,096 total.
      Applies to both the systolic (udta05/07/09) and diastolic
