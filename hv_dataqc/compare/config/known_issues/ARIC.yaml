  # -- C1: 0.6% participant loss (anchor table gap) --------------------------
  - checks: [C1]
    variable_key: "_total"
    yaml_file: null
    status: known_issue
    root_cause: anchor_table_coverage
    summary: >
      94 participants appear in the all-PHT union (15,162) but not in the
      mapped-PHT max table pht006416 (ARIC V5 AFib composite, n=15,068).
      The 0.6% gap is very small and reflects participants who appear in
      some source tables but not in the ARIC Visit 5 anchor table used for
      participant entity construction. This is a WARN (not FAIL) and does
      not indicate a pipeline failure. Re-investigate if the anchor table
      selection changes.
    confirmed_date: "2026-07-20"

  # -- C2/C3: anksbp/armsbp/bpua/bpub/abi pools (key type mismatch) ---------
  - checks: [C2, C3]
    variable_key: "anksbp13+armsbp13+bpua02+armsbp33+bpub02+armsbp43+abi20"
    yaml_file: null
    status: known_issue
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Two ABI/ankle-brachial blood pressure pools show significant N loss:
      (1) anksbp13+armsbp13+bpua02+armsbp33+bpub02+armsbp43+abi20+abi23+abi26+abi29
          [pht004027/028/029, pht006414]: 53.6% N loss (92,986 -> 43,160);
          16 null-status rows flagged -- check value_mappings key types.
      (2) anksbp01+...+bpub20 [pht004041/042/043]: 54.6% N loss
          (160,555 -> 72,920); 2,281 null-status rows flagged.
      The hv-dataqc diagnostic "null-status rows -- check value_mappings
      key types" indicates integer source values (ankle/arm blood pressure
      readings stored as integers in ARIC) do not match quoted string keys
      in the YAML value_mappings. This is the same issue fixed in FHS
      fam_income.yaml and hist_hrtdis.yaml. The YAML likely maps integer
      codes to condition_status PRESENT/ABSENT but the source provides them
      as integers (e.g., int 0 vs string '0'). The ~50% surviving rows may
      be from tables where values happen to arrive as strings.
      YAML fix needed: convert value_mappings to case(str()) expressions
      for the ABI/BP measurement blocks. Filed for investigation.
    confirmed_date: "2026-07-20"

