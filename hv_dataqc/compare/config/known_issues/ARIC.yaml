  # C2 — Real YAML bug: factor_8.yaml commented-out value_quantity
  # =========================================================================

  - checks: [C2]
    variable_key: "measurement_OBA:2041536"
    yaml_file: factor_8.yaml
    status: real_issue
    root_cause: value_quantity_commented_out
    fix_status: applied_pending_pr
    summary: >
      "Harmonized variable not matched in source -- no YAML block proposed
      this concept" for OBA:2041536 (Factor VIII). Root cause: the entire
      value_quantity block in factor_8.yaml (lines 13-21) is commented out.
      The pipeline emits 14,887 shell MeasurementObservation records with
      observation_type=OBA:2041536 and NO value_decimal (n_valid=0 in the
      harmonized JSON). The yaml_crosswalk parser correctly attributes no
      source PHV because none is bound to `value_decimal` -> spurious
      "unmatched" C2 FAIL. The commented-out expression was
      `{phv00206649} * 0.01`; the comment originates from
      commit 2a93479f (2026-03-16, "Fix ingest errors for downstream
      release") when older linkml-map couldn't multiply a `type=string`
      PHV. phv00206649 (HEMA07 Factor VIII C value) has
      calculated_type=integer with min=18, max=540 and 14,793 non-null
      rows; linkml-map 0.4.0 supports numeric-string coercion. Sibling
      files (e.g. ven_thromb.yaml) already use identical `{phv} * <num>`
      expressions on string-typed PHVs. FIX: uncomment the value_quantity
      block. Not silently dropping the observation_type means the shell
      records with n_valid=0 will become real numeric measurements.
    evidence:
      - 'Data_dict: phs000280.v9.pht004098.v4.HEMA.data_dict.xml (type=string)'
      - 'Var_report: phs000280.v9.pht004098.v4.p3.HEMA.var_report.xml (phv00206649 calculated_type=integer, n=14,793, min=18, max=540)'
      - 'Harmonized JSON: measurement_OBA:2041536 n_total=14,887 n_valid=0'
      - 'Git blame: 2a93479f (2026-03-16) commented out to work around older linkml-map ingest errors -- restored with linkml-map 0.4.0'
    confirmed_date: "2026-07-23"

  # =========================================================================
  # C2 — Pipoprotein lipoprotein/IMT arithmetic-null propagation
  # =========================================================================

  - checks: [C2, C3]
    variable_key: "lopaav45+lopbav45+lopdav45+lanamx23+lanbmx23+lopdmx23+lopcmx23"
    yaml_file: carotid_imt.yaml
    status: false_positive_pool_composition
    root_cause: derived_aggregate_intersection_vs_union
    summary: >
      OMOP:4138462 IMT pool: source=53,913; harmonized=30,198 (44% loss),
      46,520 null-status. carotid_imt.yaml emits ONE MeasurementObservation
      per participant per exam using arithmetic averages of up to 12 PHVs
      per block (e.g., `({phvA}+{phvB}+...+{phvL})/12`). Arithmetic on any
      null operand yields null in linkml-map, so the derived
      value_decimal is null whenever any operand is null. The source-side
      crosswalk aggregates the UNION of per-PHV n_valids; the harmonized
      side emits the INTERSECTION (all operands present). Union >>
      intersection -> apparent N loss. This is a design choice, not a bug.
      If preserving partial IMT records is desired, either (a) reformulate
      as a nullable-mean or (b) split into per-PHV MO blocks. Neither is
      recommended without domain input -- the current mean-of-far-and-
      near-walls semantics is standard.
    evidence:
      - YAML: priority_variables_transform/ARIC-ingest/carotid_imt.yaml:14-192
    confirmed_date: "2026-07-23"

