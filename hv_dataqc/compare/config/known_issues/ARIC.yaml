  # =========================================================================
  # C2 — Bare-key crosswalk artifact
  # =========================================================================

  - checks: [C2]
    variable_key: "measurement_OMOP:4152194"
    yaml_file: null
    status: false_positive_dataqc_tool
    root_cause: crosswalk_bare_key_no_fallback
    summary: >
      The compare tool reports "Harmonized variable not matched in source
      -- no YAML block proposed this concept" for the bare `measurement_
      OMOP:4152194` key. The yaml_crosswalk builder only emits sub-keyed
      entries like `measurement_OMOP:4152194|Seated random-zero reading`
      because every YAML block that produces OMOP:4152194 also declares
      method_type. The harmonized extractor emits BOTH bare and sub-keyed
      rows (bare key = raw MO.tsv scan; sub-keys = MOS observations list).
      When the compare tool looks up the bare harmonized key against the
      crosswalk, no exact match exists -> spurious FAIL. Filed with
      hv-dataqc enhancements: add fallback matching where a bare
      harmonized key is compared to the aggregate of all method-typed
      sub-keys before flagging as unmatched.
    confirmed_date: "2026-07-23"

