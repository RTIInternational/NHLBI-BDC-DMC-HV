      "measurement not performed or not recorded" in ARIC's visit-specific
      BP tables. The max=304 systolic is a pre-existing extreme value in
      the source data. Also: sbpa17+sbpa20 min=0 below two separate
      red_flags (40 and 15) represents both pulse pressure and diastolic
      measurements of 0 (sentinel). These are source-level data quality
      features faithfully preserved in harmonized output. Applies to all
      sbpa12/13/15/16/17/18/19/20, sbpb12-20, sbpc13-20, sbpd variants.
    confirmed_date: "2026-07-20"

