  # -- C9: ECG/QRS/ABI pool min=0, max=999 (sentinels) ----------------------
  - checks: [C9]
    variable_key: "sbpc8+sbpd8+esmb142+ecgra078+etlc26+v2ecg6+abi32"
    yaml_file: null
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Large ECG/ABI/spirometry multi-exam pool (pht004044-4089, 004194-195,
      004231-234, 006414-436, 012819-824). min=0 (ECG interval sentinel for
      unmeasured), max=999 (classic ARIC missing value sentinel for numeric
      ECG variables). The 999 value is the standard ARIC missing/unknown
      code for numeric ECG measurements and should ideally be mapped to null
      in the YAML, but it passes through as a numeric value. Source outliers
      faithfully preserved. The 999 sentinel is a known ARIC convention.
      ARIC ECG tables use 999 as a missing value code for variables that
      cannot be computed (e.g., QRS interval when paced rhythm).
    confirmed_date: "2026-07-20"

  # -- C9: CBC/hematology range violations (pre-existing source outliers) ----
  - checks: [C9]
    variable_key: "hmta01+hmtc5+hmtb01+hfaa38b+cbc6+hfaa38a"
    yaml_file: null
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Multiple CBC/hematology pools (hmta=ARIC Exam CBC, hmtb/hmtc=Exam 5
      CBC, cbc=V5 CBC, chem=chemistry panels from pht004107-110, 006422,
      012503) show range violations for all major blood count variables:
      hemoglobin (min 2.1-5, max 65-69.6), hematocrit (min 1.3, max 44.7),
      WBC (min 0.23-3.7, max 69.6-584.5), RBC (min 0.23, max 108.5),
      MCV (min 3.3, max 663.1), platelet (max 4420). These reflect
      pre-existing extreme values in the ARIC source data (critically ill
      participants, data entry errors, or laboratory outliers that passed
      QC). The values are faithfully preserved from source. Clinical review
      would be needed to determine which represent true outliers vs data
      entry errors, but this is outside the scope of the harmonization
      pipeline. Applies to all related CBC/chemistry pools:
      hmtc4+hfaa37a+hfaa37b, cbc3+hmtb03+hmta03, hmtc7+cbc9,
      hmtc8+chem26+cbc10, cbc7+hmta04+hmtb04, cbc4+hmtc3,
      cbc11+chem27+hmtc9.
    confirmed_date: "2026-07-20"

  # -- C9: spirometry FEF/FEV1/FVC min=0, ratio max=86 (sentinels+units) ----
  - checks: [C9]
    variable_key: "pfta24+pftb24"
    yaml_file: spirometry.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Spirometry pools from pht004142 (PFTA = ARIC Visit 4 spirometry) and
      pht012835 (NCS51 = ARIC V5 spirometry): FEF 25% (pfta24/pftb24),
      FEF 50% (pfta26/pftb26), and FEV1/FVC ratio (pfta31/pftb31) show
      min=0 (below red_flag 0.05-0.2 L/s) and max=100.0 (above red_flag
      1.15 for the ratio). Min=0 is a sentinel value for participants who
      could not perform the maneuver. Max=100 for FEV1/FVC ratio suggests
      the ratio is stored as a PERCENTAGE (0-100%) in pht012835 rather
      than a decimal (0-1.0). Similarly, fev1fvc1+fef_122 max=86.556 and
      pulb41/pulp41/pulp27/pulp31 max=78.0 are ratios stored as percentages
      being compared against a decimal red_flag of 1.15. These C9 FAILs
      reflect unit representation differences between ARIC exam-specific
      spirometry tables (some store ratios as decimals, some as percentages).
      The source values are faithfully preserved; the unit mismatch vs
      clinical_ranges.yaml is the issue.
    confirmed_date: "2026-07-20"
