#   known_source_data_property        - The harmonized value faithfully preserves a source
#                                       data property (outlier, sentinel, encoded 0/999,
#                                       string-typed numeric column). Fix requires either
#                                       (a) YAML-level sentinel guards or (b) a broader
#                                       missing-value policy decision. Documented, not
#                                       silently accepted.
