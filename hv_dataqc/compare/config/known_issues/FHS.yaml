  # -- C7: CVD/NOCVD missing categories (legacy FHS event codes) -------------
  - checks: [C7]
    variable_key: "mf18+cvd"
    yaml_file: null
    status: false_positive
    root_cause: value_mapping_coverage_gap
    summary: >
      FHS CVD composite variable includes 20 rows coded as 'CVD' and 20 rows
      coded as 'NOCVD' in the source (pht000009, mf18). These are early FHS
      event codes that predate the standard PRESENT/ABSENT/HISTORICAL mapping.
      The value_mappings in the YAML do not include 'CVD' or 'NOCVD' keys,
      so these 40 rows produce null condition_status and are not counted in
      the harmonized distribution. 20+20 = 40 rows out of ~20,072 (0.2% of
      total) are not actionable; adding mappings would require domain review
      of whether CVD here means incident vs prevalent event.
    confirmed_date: "2026-07-20"

