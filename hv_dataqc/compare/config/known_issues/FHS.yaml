  # -- C2/C3: e630+event 69.8% N loss (pht000309 multi-event SOE filtering) -
  - checks: [C2, C3]
    variable_key: "e630+g3a232+e416+event"
    yaml_file: angina.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      pht000309 is the FHS Sequence of Events (SOE) surveillance file with
      20,247 rows covering ALL cardiovascular event types (event codes 1-50+:
      MI, stroke, CHF, death, angina, PAD, etc.). angina.yaml correctly
      filters pht000309 for EVENT=6 (angina, first episode) AND DATE<=0
      (prevalent at baseline), producing 104 valid angina conditions from
      the 20,247 rows. The source crosswalk counts all 20,247 pht000309 rows
      as potentially attributable to the angina concept -- but the other 20,143
      rows are non-angina cardiovascular events (MI, stroke, etc.) that
      rightfully produce null angina condition_status.
      The standalone 'event' C2 FAIL (99.5% N loss, pht000309 only) has the
      same explanation. The compound pool (e630+g3a232+...) has additional
      contributions from other PHTs that provide most of the 8,737 valid rows.
    confirmed_date: "2026-07-20"

  # -- C4/C6: QRS EKG mean/SD mismatch (unit conversion + consent coverage) -
  - checks: [C4, C6]
    variable_key: "g3b0371+g3a354+g359+h306+j361+fv205+fw245+fx245+fy245+dg7"
    yaml_file: qrs_ekg.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      Two contributing factors:
      (1) pht000074 (Gen3 Exam 1, phv00021154 = G3A354) stores QRS in
      "HUNDREDTHS OF A SECOND" per dbGaP data dict. The YAML correctly
      multiplies by 10 to convert to ms. The source crosswalk uses raw
      phv00021154 values (e.g., 9 = 90 ms), so source mean is artificially
      pulled down for those rows relative to harmonized values (9 -> 90 ms).
      This partially explains the 12.7% mean shift.
      (2) pht006018 (FHS CHF table) blocks contribute ECG QRS measurements
      from CHF patients across all FHS sub-cohorts. CHF patients with LBBB
      have QRS >150 ms, inflating the source SD (78 ms vs normal ~15 ms).
      The c1+c2 consent groups may underrepresent CHF patients from
      restricted-consent sub-cohorts, reducing extreme-QRS row counts in
      harmonized output and collapsing the SD from 78 -> 39 ms.
      Both factors are structural and not correctable by YAML changes.
    confirmed_date: "2026-07-20"

