    summary: >
      ALT/SGPT pool from alt_sgpt.yaml across pht000030 (Original Exam 1),
      pht000031 (Exam 2-8), pht001045 (Offspring Exam 1-7), pht002889
      (Gen3/NOS Exam 2), pht004802 (Offspring Exam 9). alt_sgpt.yaml has
      4 pht003099 joins (age_at_observation). C2 PASSES (N preserved: 10,828
      -> 10,819, within 0.5%). C3 FAILS on missing rate: 3.68% -> 13.29%
      (d=9.6%). This apparent contradiction is explained by the harmonized
      output having MORE total rows than the source crosswalk total (extra
      null rows from anchor-constrained blocks for which the join returns no
