cohort: FHS
known_issues:

  # -- C1: 17.4% participant loss (anchor table gap) -------------------------
  - checks: [C1]
    variable_key: "_total"
    yaml_file: null
    status: known_issue
    root_cause: anchor_table_coverage
    summary: >
      FHS has 18,260 participants across 6 sub-cohorts (Original, Offspring,
      New Offspring Spouse, Gen3, Omni1, Omni2), but the pipeline anchor table
      pht003099 (ExamData / Offspring+Omni1 exam data) covers only 15,089
      participants. The ~3,171-participant gap reflects Original Cohort members
      (Exams 1-32) and Gen3/Omni2 participants who appear in other source PHTs
      but have no corresponding row in pht003099. These participants generate
      source-side PHV counts but no harmonized entity rows. The 17.4% gap is
      structural and stable across runs.
    confirmed_date: "2026-07-20"

  # -- C2/C3: condition_MISSING_CONCEPT and condition_UNKNOWN ----------------
  - checks: [C2, C3]
    variable_key: "condition_MISSING_CONCEPT"
    yaml_file: null
    status: false_positive
    root_cause: multi_concept_phv_attribution
    summary: >
      Condition rows with null condition_concept arise from multi-concept
      routing in Condition YAML blocks where the condition_concept is derived
      from a PHV with coded values. Participants whose source PHV value doesn't
      match any value_mappings key produce null condition_concept rows.
      This is the same structural null-routing pattern seen in MESA, CHS, and
      JHS. The null rows are structurally expected for the multi-concept
      design and do not indicate a pipeline defect.
    confirmed_date: "2026-07-20"

  - checks: [C2, C3]
    variable_key: "condition_UNKNOWN"
    yaml_file: null
    status: false_positive
    root_cause: multi_concept_phv_attribution
    summary: >
      Same as condition_MISSING_CONCEPT -- Condition rows with UNKNOWN status
      that the crosswalk cannot match to any source PHV pool. Expected
      structural artifact of multi-concept condition routing.
    confirmed_date: "2026-07-20"

