      by blocks from Gen3/Offspring tables where some participants appear in
      pht002889/pht004802 but not pht003099, causing null age_at_observation.
      These rows count toward the harmonized denominator but not n_valid,
      increasing the apparent missing rate. The actual ALT values are correct
      (C2 PASS confirms ~same valid count). Re-investigate if anchor table
      coverage is expanded.
