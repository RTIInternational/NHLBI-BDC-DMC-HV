      triglycerides in mg/dL (C4 confirms: mean preserved at 125.7). The
      x0.295 factor in the C5 crosswalk metadata is incorrect for
      triglycerides -- the correct mg/dL -> mmol/L factor is 0.01129, not
      0.295. The OMOP:4041722 pool crosswalk metadata has an erroneous
      conversion factor. The YAML is correct (outputs mg/dL as declared).
    confirmed_date: "2026-07-20"

