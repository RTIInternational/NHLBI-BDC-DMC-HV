  - checks: [C2, C3]
    variable_key: "crp+crp_1+crp_7+crp_8"
    yaml_file: crp.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      CRP is measured in 8 FHS tables spanning Original (pht000080/081),
      Offspring Exam 9 (pht002889, pht004802), Gen3 Exam 2 (pht010726), and
      Gen3/Omni GWAS cycles (pht012880/881/882). Source crosswalk n_valid=18,058
      reflects the DCC's table-union view; harmonized n_valid=27,569 reflects
      the full multi-generation output including phv00520365 (pht012880, n=4,516)
      and phv00462196 (pht010726, n=3,417) which push the harmonized count
      above the source crosswalk total. This N gain indicates more FHS
      sub-cohort participants contribute CRP measurements than the DCC crosswalk
      aggregates. Both C4 mean (d=0.066) and C6 SD (d=0.094) mismatches follow
      from the changed pool composition.
    confirmed_date: "2026-07-20"

