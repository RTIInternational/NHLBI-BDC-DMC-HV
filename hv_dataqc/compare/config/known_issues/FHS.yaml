  # -- C7: hosp2 '0.0' missing category (hospitalization null mapping) -------
  - checks: [C7]
    variable_key: "fr264+fr265+fs359+fs360+ft361+ft362+g135+g136+g3a165+g3a166"
    yaml_file: hist_hrtdis.yaml
    status: false_positive
    root_cause: value_mapping_coverage_gap
    summary: >
      4,119 source rows in the hospitalization/heart disease variable pool
      have category '0.0' in the source (coded as "no event/hospitalization")
      which is not mapped in the YAML value_mappings. Only 407 PRESENT rows
      make it to harmonized, as the 0.0 "none" rows are effectively dropped.
      In FHS, '0.0' in these condition variables represents participants who
      had no hospitalization during that exam period -- this should map to
      ABSENT. The omission means these rows produce null condition_status.
      The C2 91% N loss for this variable pool is directly caused by this
      missing mapping.
    confirmed_date: "2026-07-20"

  # -- C4/C6: ctni+chf070 mean/SD near-zero (unit conversion via expr) -------
  - checks: [C4, C6]
    variable_key: "ctni+chf070"
    yaml_file: troponin.yaml
    status: false_positive
    root_cause: unit_conversion_mean_crosswalk
    summary: >
      phv00141866 (CTNI, pht002072) is stored as pg/mL per dbGaP data dict
      (unit=pg/mL, logical_min=0.78 pg/mL). troponin.yaml divides by 1000
      via expr to convert to ng/mL (1 ng/mL = 1000 pg/mL). C4 compares raw
      source mean (4.09 pg/mL) vs harmonized mean (0.004 ng/mL) without
      knowing about the /1000 in the YAML expr (not unit_conversion: block).
      The 0.9964 d-ratio is entirely explained by the correct 1000x unit
      conversion. C6 SD is similarly 1000x different. C5 does not detect
      this conversion because the YAML uses expr not unit_conversion:.
      C2 N loss (22.6%): phv00141868 (CTNI_I, code 1 = below measurable
      range) rows are intentionally set to None in the YAML (below-LOD
      exclusion). Source already imputed these to 0.78 pg/mL but the YAML
      excludes them from harmonized output by design.
    confirmed_date: "2026-07-20"

  # -- C2/C3: ctni+chf070 N loss (intentional LOD exclusion) ----------------
  - checks: [C2, C3]
    variable_key: "ctni+chf070"
    yaml_file: troponin.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      22.6% N loss (3,518 -> 2,724) caused by the YAML excluding rows where
      CTNI_I (phv00141868) = 1 (below measurable range). Source counts all
      non-null CTNI rows including below-LOD values imputed to 0.78 pg/mL.
      Harmonized excludes below-LOD rows (intentional LOD cutoff at 0.78
      pg/mL). This is the correct clinical behavior for high-sensitivity
      troponin assays.
    confirmed_date: "2026-07-20"

  # -- C5: triglycerides x0.295 conversion not applied (wrong metadata) ------
  - checks: [C5]
