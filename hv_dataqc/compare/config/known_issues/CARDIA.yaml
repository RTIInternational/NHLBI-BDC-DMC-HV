  # ── Weight: lbs→kg unit conversion crosswalk artifact ────────────────────
  - checks: [C6]
    variable_key: "c20wgt"
    yaml_file: bdy_wgt.yaml
    status: false_positive
    root_cause: unit_conversion_sd_crosswalk
    summary: >
      bdy_wgt.yaml converts all weight blocks from lbs to kg (× 0.45359237).
      C6 reports source SD=43.3 vs harmonized SD=19.3. These are equivalent:
      43.3 lbs × 0.454 = 19.7 kg ≈ 19.3 kg. The C6 check compares raw SDs
      without accounting for the unit conversion. This is a framework
      limitation — the conversion is correct.
    confirmed_date: "2026-06-28"

  # ── Hemoglobin: MCH crosswalk false positive ──────────────────────────────
  - checks: [C4, C6]
    variable_key: "a05hgb"
    yaml_file: hemo.yaml
    status: false_positive
    root_cause: crosswalk_phv_reuse_in_derived_formula
    summary: >
      mch.yaml computes MCH using the formula ({phv00112688}/{phv00112687})*10,
      where phv00112688=HEMOGLOBIN and phv00112687=RED CELL COUNT. The
      crosswalk matches source key 'a05hgb' (→ phv00112688) to the MCH
      concept via mch.yaml, causing C4/C6 to compare hemoglobin g/dL (~14.2)
      against MCH picograms (~30). Both hemo.yaml (hemoglobin) and mch.yaml
      (MCH formula) are correct; the mismatch is from the crosswalk mapping
      a shared PHV to a derived concept. Max=293 in harmonized reflects
      extreme MCH values from low RBC outliers.
    confirmed_date: "2026-06-28"

  # ── Fruit serving: crosswalk pools individual component vs total ──────────
  - checks: [C4, C6]
    variable_key: "a06fru0300"
    yaml_file: fruit_serving.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      fruit_serving.yaml harmonizes TOTAL fruit (sum of 5 types × 7 days).
      The C4 crosswalk pools source variables including individual-type
      variables (a06fru0300=citrus only) and pre-aggregated totals
      (a06fruit=total fruit), producing a mixed-scope source mean (~1.77).
      Harmonized total-fruit mean (~7.16 servings/week = ~1.02/day for
      5 combined types) is correct; the mismatch is a crosswalk scope
      artifact. No formula bug.
    confirmed_date: "2026-06-28"

  # ── Vegetable serving: crosswalk pools individual component vs total ──────
  - checks: [C4, C6]
    variable_key: "a06veg0100"
    yaml_file: vege_serving.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      vege_serving.yaml harmonizes TOTAL vegetables (sum of 11 types × 7 days).
      The C4 crosswalk pools source variable a06veg0100 (dark-green vegetables
      only, mean ~0.45/week) against harmonized total-veg mean (~26.6/week
      for all 11 types combined). The 58x ratio is entirely explained by
      the scope difference (1 veg type vs 11). No formula bug.
    confirmed_date: "2026-06-28"

  # ── Sleep duration: borderline SD mismatch ────────────────────────────────
  - checks: [C6]
    variable_key: "c42chour"
    yaml_file: sleep_duration_daily.yaml
