  # ── Urine creatinine: unit-mix crosswalk artifact ─────────────────────────
  - checks: [C4, C6]
    variable_key: "fl1ucret+el8ucret+fl1creat"
    yaml_file: creat_urin.yaml
    status: false_positive
    root_cause: unit_conversion_mean_crosswalk
    summary: >
      The source pool mixes three variables at different unit scales:
      phv00119619 (EL8UCRET, pht001803, mg/dL, range 9-608),
      phv00120675 (FL1UCRET, pht001849, unit not stated but same range
      9.4-787.6 as EL8UCRET -> mg/dL), and phv00120751 (FL1CREAT,
      pht001852, mg/mL, range 0.095-3.69). The source pool uses raw values
      including FL1CREAT at mg/mL scale (~1.47 mean), pulling the pooled
      source mean down. The harmonized pool correctly applies x100 to
      FL1CREAT -> mg/dL (~147 mg/dL), so harmonized mean (156.47) is slightly
      higher than the mixed-unit source mean (147.17). The ~6% delta is
      entirely explained by the unit heterogeneity in the source pool.
      All three YAML blocks output in mg/dL; the YAML is correct.
    confirmed_date: "2026-07-17"
