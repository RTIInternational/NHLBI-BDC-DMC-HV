      C4/C6 mismatches (source 12.07 µIU/mL vs harmonized 83.79 pmol/L) are
      the µIU/mL → pmol/L conversion (factor 6.945); the harmonized value is
      correct and the mismatch is a unit_conversion_mean_crosswalk artifact.
    related_issues: []
    confirmed_date: "2026-07-06"

  # ── Cig_smok: code-0 (never-smoked) → null suppresses never-smokers ──────
  - checks: [C1, C2, C3, C7]
    variable_key: "a09smknw"
    yaml_file: cig_smok.yaml
    status: false_positive
    root_cause: code_zero_null_suppression
    summary: >
      cig_smok.yaml pht001573 block (A10SMOKE, Year 0 -- table A4F10,
      confirmed from dbGaP data dict) maps code '0' (never smoked) to None,
