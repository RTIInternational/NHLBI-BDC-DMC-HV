  # ── Height: mixed-unit source pool crosswalk artifact ────────────────────
  - checks: [C4, C6]
    variable_key: "e12hgt"
    yaml_file: bdy_hgt.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      bdy_hgt.yaml correctly converts feet-encoded ancillary tables to cm.
