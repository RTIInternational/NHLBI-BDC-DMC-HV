  # ── Urine albumin: unit conversion SD crosswalk artifact ─────────────────
  - checks: [C6]
    variable_key: "fl1ualb+el8ualb"
    yaml_file: albumin_urine.yaml
    status: false_positive
    root_cause: unit_conversion_sd_crosswalk
    summary: >
      albumin_urine.yaml converts urine albumin from mg/dL to mg/L (x10).
      C6 source SD=17.75 vs harmonized SD=177.51 -- ratio is exactly 10,
