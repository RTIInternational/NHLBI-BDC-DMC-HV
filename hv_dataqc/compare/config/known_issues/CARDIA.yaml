  # ── Alcohol servings: crosswalk source scope mismatch ────────────────────
  - checks: [C1, C2, C3, C4, C6]
    variable_key: "a07liqr"
    yaml_file: alcohol_servings.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      alcohol_servings.yaml harmonizes total alcohol servings across multiple
      CARDIA exam years. The source crosswalk captures only pht001568 (Year 0,
      key a07liqr+a07beer+a07wine, n_valid=10,849), while the harmonized pools
      data from all exam-year tables, producing ~3× more rows (n_valid=32,177).
      N gain (C2/C3), mean mismatch (C4, source 1.11 vs harmonized 4.15, ratio
      3.75×), and SD mismatch (C6) are all artifacts of the crosswalk seeing
      only one of the contributing PHTs. Same pattern as fruit_serving and
      vege_serving.
    confirmed_date: "2026-07-06"

  # ── Angina: multi-block Condition design ─────────────────────────────────
  - checks: [C1, C2, C3]
    variable_key: "a09angin"
    yaml_file: angina.yaml
    status: false_positive
    root_cause: multi_block_condition_design
    summary: >
      angina.yaml has 27 blocks across 9 tables (pht001570, pht001607,
      pht001656, pht001715, pht001749, pht001761, pht001811, pht001869,
      pht001871). Each table has 3 evidence-indicator blocks (episode,
      symptoms, treatment or equivalent), producing up to 3 Condition records
      per participant per visit. C2/C3 compare source n_valid (one count per
      source table) against harmonized n_valid (3× per table). N gain and
      missing-rate change are expected behavior for the multi-evidence-indicator
      design, consistent with chr_bronchitis, emphysema, and diabetes (#651).
    related_issues: [651]
    confirmed_date: "2026-06-30"

  # ── BMI: source pool uses wrong-form PHTs for Years 10 and 15 ───────────
  - checks: [C1, C2, C3, C4, C6]
    variable_key: "a20bmi"
    yaml_file: bmi.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      bmi.yaml correctly uses the F20 (Form 20 = anthropometry) tables, which
      are the only ones that contain BMI variables: pht001583 (A4F20/Yr0
      A20BMI), pht001632 (B2F20/Yr2 B20BMI), pht001671 (C1F20/Yr5 C20BMI),
      pht001720 (D1F20A/Yr7 D20BMI), pht001785 (E1F20/Yr10 E20BMI), pht001857
      (F2F20/Yr15 F20BMI), pht003298 (HeartGO baseline). The source crosswalk
      has three errors: (1) uses pht001779 (E1F11/Yr10) and pht001818
      (F1F10/Yr15) — non-anthropometry forms with NO BMI variable (confirmed
      against data dict XML); (2) includes pht001669 (C1F17/Yr5) which also
      has no BMI; (3) omits Year 2 entirely (pht001632 missing from pool).
      N gain = Years 2, 10, 15 BMI records present in harmonized but missing
      from source pool. YAML is more complete and correct than source extraction.
    confirmed_date: "2026-07-05"

  # ── Cig_smok: PHV correction causes source/harmonized crosswalk mismatch ─
  - checks: [C1, C2, C3]
    variable_key: "a09yrsqt"
    yaml_file: cig_smok.yaml
    status: false_positive
    root_cause: phv_correction_source_crosswalk_mismatch
    summary: >
      cig_smok.yaml pht001572 block was corrected from phv00113169
      (a09yrsqt = years quit smoking) to phv00113168 (smoking status,
      current vs former vs never). The source crosswalk still uses
      phv00113169 as the source key (a09yrsqt), which has n_valid=7,376
      non-null "years quit" rows. The harmonized now uses phv00113168 for
      the value_enum, which has n_valid=8,379 valid rows. The N gain
      (C2) and missing-rate change (C3) are an artifact of comparing two
      different PHVs from the same table. The PHV fix is correct; a fresh
      source extraction using the updated YAML will resolve this mismatch.
    confirmed_date: "2026-06-30"

  # ── Insulin: source crosswalk incomplete (recently added YAML) ───────────
  - checks: [C1, C2, C4, C6]
    variable_key: "measurement_OBA:2060174"
    yaml_file: insulin_blood.yaml
    status: false_positive
    root_cause: crosswalk_scope_incomplete_new_yaml
    summary: >
      insulin_blood.yaml was recently added to the CARDIA pipeline. The source
      summary JSON (cardia_source_20260630_022350.json) was generated before
      this YAML was activated, so the crosswalk has no source-side entry for
      OBA:2060174. The C2 FAIL "Harmonized variable not matched in source" is
      expected until the source extractor is re-run against the updated YAML.
      Additionally, the unit conversion u[IU]/mL caused a pint UndefinedUnitError
      in the current run, producing all-null output; this is being fixed
      separately (see insulin_blood.yaml unit conversion fix).
      C4/C6 mismatches (source 12.07 µIU/mL vs harmonized 83.79 pmol/L) are
      the µIU/mL → pmol/L conversion (factor 6.945); the harmonized value is
      correct and the mismatch is a unit_conversion_mean_crosswalk artifact.
    related_issues: []
    confirmed_date: "2026-07-06"

  # ── Cig_smok: code-0 (never-smoked) → null suppresses never-smokers ──────
  - checks: [C2, C3]
    variable_key: "a09smknw"
    yaml_file: cig_smok.yaml
    status: false_positive
    root_cause: code_zero_null_suppression
    summary: >
      cig_smok.yaml pht001573 block (A10SMOKE Year 2) maps code '0' (never
      smoked) to None, intentionally excluding never-smokers from the
      harmonized Observation pool. Source extraction includes all rows
      (n_valid=4,948); harmonized output only includes ever-smokers who
      have a smoking-status code mapped to a non-null value. N loss and
      missing-rate increase (C2/C3) are expected. Same design pattern as
      chr_bronchitis.yaml (a12cbron entry above).
    confirmed_date: "2026-07-06"