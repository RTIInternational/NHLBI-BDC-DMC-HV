cohort: CARDIA
known_issues:

  # ── C0: Consent-group pipeline failure ───────────────────────────────────
  # The c2 consent group produces an empty Person.tsv (0 bytes). This is a
  # dm-bip pipeline issue (issue #335): the pht001748 demographics table is
  # blank in the c2 group. No YAML fix is possible; tracking here so the
  # C0 FAIL is documented and not confused with a transform defect.

  - checks: [C0]
    variable_key: "Person_file_coverage"
    yaml_file: null
    status: false_positive
    root_cause: consent_group_pipeline_failure
    summary: >
      The c2 consent group (DMC_nih-nhlbi-topmed-parent-cardia-phs000285-v3-r1-c2)
      produces an empty Person.tsv (0 bytes or parse failure). The c1 group loads
      3,147 rows successfully. Root cause is dm-bip issue #335: pht001748
      (demographics) is empty in the c2 extract. No YAML change can resolve this;
      the fix requires a dm-bip pipeline correction. The C0 FAIL is a pipeline
      infrastructure issue, not a data-quality or transform defect.
    related_issues: [335]
    confirmed_date: "2026-07-05"

  # ── Multi-block Condition design (#651) ──────────────────────────────────
  # Several CARDIA condition YAMLs create multiple Condition records per
  # participant per table (one per evidence indicator), while C2 counts
  # each source table's contribution once. This is intentional design:
  # each indicator (e.g., ever-had / still-have / doctor-diagnosed) is a
  # distinct clinical observation. The resulting N gain in C2 is expected.

  - checks: [C1, C2, C3]
    variable_key: "a12cbron"
    yaml_file: chr_bronchitis.yaml
    status: false_positive
    root_cause: code_zero_null_suppression
    summary: >
      pht001575 (Year 0): code 0 (never-reported) maps to null, removing
      those participants from harmonized output entirely. This is intentional
      design — "never had" = no Condition record — but causes N LOSS vs.
      source (17,883 → 15,418, ~13.8%) and ~5,249 null-status rows in the
      harmonized. C2 N-loss and C3 missing-rate change are expected. The
      multi-block structure (3 indicators per participant) and later PHTs
      (pht001715, pht001761, pht001811) do not exhibit the same null pattern.
    related_issues: [651]
    confirmed_date: "2026-07-06"

  - checks: [C1, C2, C3]
    variable_key: "a08diab"
    yaml_file: diabetes.yaml
    status: false_positive
    root_cause: multi_block_condition_design
    summary: >
      pht001869 and pht001871 (Year 20) each have 6 blocks covering
      self-report, doctor-diagnosed, medication, fasting glucose, glucose
      tolerance, and algorithm-derived diabetes indicators. Each generates
      one Condition record per participant per indicator. N gain (~46.0%)
      is expected.
    related_issues: [651]
    confirmed_date: "2026-06-28"

  - checks: [C1, C2, C3]
    variable_key: "a12emph"
    yaml_file: emphysema.yaml
    status: false_positive
    root_cause: multi_block_condition_design
    summary: >
      pht001575 (Year 0) has 3 blocks (a12emph, a12emstl, a12emdoc);
      pht001811 (Year 15) has 2 blocks (primary f08emph + PRESENT-only
      secondary). Each generates one Condition record. N gain (~42.6%)
      is expected.
    related_issues: [651]
    confirmed_date: "2026-06-28"

  # ── Unknown-code '8' → UNKNOWN design (#653) ─────────────────────────────
  # fam_stroke, hyperten, and stroke_isch_atk map source code '8' (don't
  # know / refused) to UNKNOWN condition_status. The source extraction
  # treats '8' as null/missing → excluded from source n_valid. Harmonized
  # maps '8' to non-null UNKNOWN → included in harmonized n_valid.
  # The N gain is the count of code-8 rows. Design intent confirmed:
  # capturing patient-reported uncertainty as UNKNOWN is clinically
  # meaningful; it preserves the observation rather than discarding it.

  - checks: [C1, C2, C3]
    variable_key: "a11mstrk"
    yaml_file: fam_stroke.yaml
    status: false_positive
    root_cause: unknown_code_to_UNKNOWN_status
    summary: >
      fam_stroke.yaml maps code '8' (don't know) and 'M' (missing) to
      UNKNOWN condition_status. Source treats these as null (n_valid=26,014);
      harmonized includes them (n_valid=29,133, +12.0%). Additional factor:
      3-block design (mother/father/sibling) multiplies records per
      participant. Both are intentional design decisions.
    related_issues: [653]
    confirmed_date: "2026-06-28"

  - checks: [C2, C3]
    variable_key: "a09hbpg1"
    yaml_file: hyperten.yaml
    status: false_positive
    root_cause: unknown_code_to_UNKNOWN_status
    summary: >
      hyperten.yaml maps code '8' (don't know) to UNKNOWN for pht001656,
      pht001715, pht001749, pht001761, pht001811 (Years 5, 7, 10, 15).
      Source treats '8' as null; harmonized maps to UNKNOWN. The N gain
      of ~51.0% (11,116 → 16,787) is almost entirely accounted for by the
      ~28.4% missing-rate delta × ~19,981 total records = ~5,673 code-8 rows.
    related_issues: [653]
    confirmed_date: "2026-06-28"

  - checks: [C1, C2, C3]
    variable_key: "y01tia"
    yaml_file: stroke_isch_atk.yaml
    status: false_positive
    root_cause: unknown_code_to_UNKNOWN_status
    summary: >
      stroke_isch_atk.yaml maps code '8' (don't know) to UNKNOWN for
      pht001715, pht001761, pht001811 (Years 7, 10, 15). Source treats
      '8' as null; harmonized maps to UNKNOWN (+19.8%, 13,953 → 16,717).
      Secondary factor: pht001870 (CARDIA HOSPITALIZATIONS DIAGNOSIS)
      generates ~263 records not in the source extraction pool — this is a
      source extractor scope gap, not a YAML defect.
    related_issues: [653]
    confirmed_date: "2026-06-28"

  # ── fam_income.yaml value_concept category mismatch (#652 Bug 2) ─────────
  - checks: [C1, C2, C3, C7]
    variable_key: "c03incom"
    yaml_file: fam_income.yaml
    status: false_positive
    root_cause: value_concept_not_in_value_enum
    summary: >
      C2/C7 category check reports source categories ['0.0'..'9.0'] missing
      from harmonized. All 4 income tables are reported_type=encoded with
      calculated_type=enum_integer (confirmed from var_report metadata) —
      the var_report shows decoded text labels for display, but the BDC
      extract stores integer codes. value_mappings have been added to all
      4 blocks converting integer codes to dollar-range text labels (#652).
      The C2/C7 category check failure is a tool limitation: income is
      stored in value_quantity.value_concept, but the check looks at
      value_enum. This cannot be resolved without restructuring the observation
      model; document as false_positive for this check.
    related_issues: [652]
    confirmed_date: "2026-06-28"

  # ── Asthma: multi-block Condition design ─────────────────────────────────
  - checks: [C2, C3]
    variable_key: "a12asthm"
    yaml_file: asthma.yaml
    status: false_positive
    root_cause: multi_block_condition_design
    summary: >
      asthma.yaml has 23 blocks across 10 tables (pht001575, pht001584,
      pht001626, pht001715, pht001721, pht001761, pht001811, pht001869,
      pht001870, pht001871). Multiple blocks per table produce multiple
      Condition records per participant per visit. pht001575 code 0
      (never-had) maps to UNKNOWN, creating extra records vs. source
      count → C2 N gain (~9.3%) is expected. Several later-PHT blocks
      map only code '2' (PRESENT), so non-PRESENT rows produce
      null-status Condition records → ~17,003 null-status rows and C3
      missing-rate change (d=5.6%) are expected from the same
      multi-evidence-indicator design as chr_bronchitis and emphysema (#651).
    related_issues: [651]
    confirmed_date: "2026-07-06"

  # ── Weight: lbs→kg unit conversion crosswalk artifact ────────────────────
  - checks: [C6]
    variable_key: "c20wgt"
    yaml_file: bdy_wgt.yaml
    status: false_positive
    root_cause: unit_conversion_sd_crosswalk
    summary: >
      bdy_wgt.yaml converts all weight blocks from lbs to kg (× 0.45359237).
      C6 reports source SD=43.3 vs harmonized SD=19.3. These are equivalent:
      43.3 lbs × 0.454 = 19.7 kg ≈ 19.3 kg. The C6 check compares raw SDs
      without accounting for the unit conversion. This is a framework
      limitation — the conversion is correct.
    confirmed_date: "2026-06-28"

  # ── Hemoglobin: MCH crosswalk false positive ──────────────────────────────
  - checks: [C4, C6, C9]
    variable_key: "a05hgb"
    yaml_file: hemo.yaml
    status: false_positive
    root_cause: crosswalk_phv_reuse_in_derived_formula
    summary: >
      mch.yaml computes MCH using the formula ({phv00112688}/{phv00112687})*10,
      where phv00112688=HEMOGLOBIN and phv00112687=RED CELL COUNT. The
      crosswalk matches source key 'a05hgb' (→ phv00112688) to the MCH
      concept via mch.yaml, causing C4/C6 to compare hemoglobin g/dL (~14.2)
      against MCH picograms (~30). Both hemo.yaml (hemoglobin) and mch.yaml
      (MCH formula) are correct; the mismatch is from the crosswalk mapping
      a shared PHV to a derived concept. Max=293 in harmonized reflects
      extreme MCH values from low RBC outliers.
    confirmed_date: "2026-06-28"

  # ── Fruit serving: crosswalk pools individual component vs total ──────────
  - checks: [C4, C6]
    variable_key: "a06fru0300"
    yaml_file: fruit_serving.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      fruit_serving.yaml harmonizes TOTAL fruit (sum of 5 types × 7 days).
      The C4 crosswalk pools source variables including individual-type
      variables (a06fru0300=citrus only) and pre-aggregated totals
      (a06fruit=total fruit), producing a mixed-scope source mean (~1.77).
      Harmonized total-fruit mean (~7.16 servings/week = ~1.02/day for
      5 combined types) is correct; the mismatch is a crosswalk scope
      artifact. No formula bug.
    confirmed_date: "2026-06-28"

  # ── Vegetable serving: crosswalk pools individual component vs total ──────
  - checks: [C4, C6]
    variable_key: "a06veg0100"
    yaml_file: vege_serving.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      vege_serving.yaml harmonizes TOTAL vegetables (sum of 11 types × 7 days).
      The C4 crosswalk pools source variable a06veg0100 (dark-green vegetables
      only, mean ~0.45/week) against harmonized total-veg mean (~26.6/week
      for all 11 types combined). The 58x ratio is entirely explained by
      the scope difference (1 veg type vs 11). No formula bug.
    confirmed_date: "2026-06-28"

  # ── Sleep duration: borderline SD mismatch ────────────────────────────────
