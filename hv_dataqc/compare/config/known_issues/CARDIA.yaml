  # ── Alcohol servings: crosswalk source scope mismatch ────────────────────
  - checks: [C2, C3, C6]
    variable_key: "a07liqr"
    yaml_file: alcohol_servings.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      alcohol_servings.yaml harmonizes total alcohol servings across multiple
      CARDIA exam years. The source crosswalk captures only pht001568 (Year 0,
      key a07liqr+a07beer+a07wine, n_valid=10,849), while the harmonized pools
      data from all exam-year tables, producing ~3× more rows (n_valid=32,177).
      N gain (C2/C3) and SD mismatch (C6) are artifacts of the crosswalk seeing
      only one of the contributing PHTs. Same pattern as fruit_serving and
      vege_serving.
    confirmed_date: "2026-06-30"

  # ── Angina: multi-block Condition design ─────────────────────────────────
  - checks: [C2, C3]
    variable_key: "a09angin"
    yaml_file: angina.yaml
    status: false_positive
    root_cause: multi_block_condition_design
    summary: >
      angina.yaml has 27 blocks across 9 tables (pht001570, pht001607,
      pht001656, pht001715, pht001749, pht001761, pht001811, pht001869,
      pht001871). Each table has 3 evidence-indicator blocks (episode,
      symptoms, treatment or equivalent), producing up to 3 Condition records
      per participant per visit. C2/C3 compare source n_valid (one count per
      source table) against harmonized n_valid (3× per table). N gain and
      missing-rate change are expected behavior for the multi-evidence-indicator
      design, consistent with chr_bronchitis, emphysema, and diabetes (#651).
    related_issues: [651]
    confirmed_date: "2026-06-30"

  # ── BMI: crosswalk source scope mismatch (one PHT missing) ───────────────
  - checks: [C2, C3, C4, C6]
    variable_key: "a20bmi"
    yaml_file: bmi.yaml
    status: false_positive
    root_cause: crosswalk_source_scope_mismatch
    summary: >
      bmi.yaml has 14 blocks across 7 exam-year tables (pht001583, pht001632,
      pht001671, pht001720, pht001785, pht001857, pht003298). The source
      crosswalk pooled only 6 source variables from 6 tables (a20bmi, b20bmi,
      c20bmi, d20bmi, e20bmi, f20bmi); one table is absent from the crosswalk
      pool. This produces a N gain in C2/C3 and mean/SD mismatches in C4/C6
      because the harmonized aggregates all 7 visits while the source pool
      covers only 6.
    confirmed_date: "2026-06-30"

  # ── Cig_smok: PHV correction causes source/harmonized crosswalk mismatch ─
  - checks: [C2, C3]
    variable_key: "a09yrsqt"
    yaml_file: cig_smok.yaml
    status: false_positive
    root_cause: phv_correction_source_crosswalk_mismatch
    summary: >
      cig_smok.yaml pht001572 block was corrected from phv00113169
      (a09yrsqt = years quit smoking) to phv00113168 (smoking status,
      current vs former vs never). The source crosswalk still uses
      phv00113169 as the source key (a09yrsqt), which has n_valid=7,376
      non-null "years quit" rows. The harmonized now uses phv00113168 for
      the value_enum, which has n_valid=8,379 valid rows. The N gain
      (C2) and missing-rate change (C3) are an artifact of comparing two
      different PHVs from the same table. The PHV fix is correct; a fresh
      source extraction using the updated YAML will resolve this mismatch.
    confirmed_date: "2026-06-30"

