  omop_codes: []
  common_phv_names: ["HR", "AVGHR", "HEART_RATE", "HRTRT"]

# ── Spirometry (percent predicted — must come BEFORE raw volumes for matching) ─
fev1pp:
  unit: "%"
  plausible_lo: 5
  plausible_hi: 200
  red_flag_lo: 0
  red_flag_hi: 250
  notes: "FEV1 percent predicted. Values >100% are normal; >150% possible but rare."
  oba_codes: []
  omop_codes: ["OMOP:3011708"]
  common_phv_names: ["FEV1PP", "FEV1PP_PRE", "FEV1PP_POST", "FEV1_PCT_PRED", "PCT_PRE_FEV1", "PCT_POST_FEV1"]

fvcpp:
  unit: "%"
  plausible_lo: 5
  plausible_hi: 200
  red_flag_lo: 0
  red_flag_hi: 250
  notes: "FVC percent predicted."
  oba_codes: []
  omop_codes: ["OMOP:3005600"]
  common_phv_names: ["FVCPP", "FVCPP_PRE", "FVCPP_POST", "FVC_PCT_PRED", "PCT_PRE_FVC", "PCT_POST_FVC"]

# ── Spirometry (raw volumes) ─────────────────────────────────────────────────
fev1:
  unit: L
  plausible_lo: 0.3
  plausible_hi: 6.5
  red_flag_lo: 0.1
  red_flag_hi: 8.0
  notes: "Forced expiratory volume in 1 sec. Severely restricted COPD can be <0.5L."
  oba_codes: []
  omop_codes: ["OMOP:4241837", "OMOP:3022891"]
  common_phv_names: ["FEV1", "FEV1_PRE", "FEV1_POST", "PRBDFEV1", "POBDFEV1", "PRE_FEV1_DERV", "POST_FEV1_DERV", "PRED_FEV1"]

fvc:
  unit: L
  plausible_lo: 0.5
  plausible_hi: 8.5
  red_flag_lo: 0.2
  red_flag_hi: 10.0
  notes: "Forced vital capacity. Generally FVC >= FEV1."
  oba_codes: []
  omop_codes: ["OMOP:4176265", "OMOP:3002094"]
  common_phv_names: ["FVC", "FVC_PRE", "FVC_POST", "PRBDFVC", "POBDFVC", "PRE_FVC_DERV", "POST_FVC_DERV", "PRED_FVC"]

fev1_fvc_ratio:
  unit: "%"
  plausible_lo: 15
  plausible_hi: 100
  red_flag_lo: 10
  red_flag_hi: 110
  notes: "FEV1/FVC ratio expressed as percentage (0–100 scale). <70% = COPD diagnostic threshold. PRED_FEV1FVC uses same scale."
  oba_codes: []
  omop_codes: ["OMOP:3024594"]
  common_phv_names: ["FEV1_FVC", "FEV1_FVC_RATIO", "PRED_FEV1FVC"]

fev1_fvc_ratio_decimal:
  unit: ratio
  plausible_lo: 0.10
  plausible_hi: 1.00
  red_flag_lo: 0.05
  red_flag_hi: 1.15
  notes: "FEV1/FVC ratio as decimal (0–1 scale). <0.7 = COPD threshold. SPIROMICS PRE/POST_FEV1FVC_DERV use this scale."
  oba_codes: []
  omop_codes: ["OMOP:3011505"]
  common_phv_names: ["PRE_FEV1FVC_DERV", "POST_FEV1FVC_DERV"]

fev1_fvc_ratio_pp:
  unit: "%"
  plausible_lo: 20
  plausible_hi: 140
  red_flag_lo: 10
  red_flag_hi: 170
  notes: "FEV1/FVC percent predicted. Values >100% mean actual ratio exceeds predicted reference; possible in restricted patterns."
  oba_codes: []
  omop_codes: ["OMOP:4196583"]
  common_phv_names: ["PCT_PRE_FEV1FVC", "PCT_POST_FEV1FVC"]

