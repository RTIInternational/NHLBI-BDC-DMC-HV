  plausible_hi: 250
  red_flag_lo: 40
  red_flag_hi: 300
  notes: "Systolic BP. Severe hypotension <70, hypertensive crisis >250."
  oba_codes: []
  omop_codes: ["OMOP:4152194"]
  common_phv_names: ["SBP", "AVGSYS", "SYSTOLIC", "SYSBP"]

bp_diastolic:
  unit: "mmHg"
  plausible_lo: 30
  plausible_hi: 150
  red_flag_lo: 15
  red_flag_hi: 200
  notes: "Diastolic BP. Should always be < systolic."
  oba_codes: []
  omop_codes: ["OMOP:4154790"]
  common_phv_names: ["DBP", "AVGDIA", "DIASTOLIC", "DIABP"]

heart_rate:
