# ── Cross-Variable Consistency Rules ─────────────────────────────────────────
# These rules define expected relationships BETWEEN variables.
# Used by check_yaml_consistency.py and compare_source_harmonized.py.
_cross_variable_rules:
  sbp_gt_dbp:
    description: "Systolic BP should always be greater than Diastolic BP"
    check: "mean(SBP) > mean(DBP)"
    variables: [bp_systolic, bp_diastolic]
    severity: ERROR

  bmi_consistency:
    description: "BMI ≈ weight_kg / (height_m)² within ±10%"
    check: "mean(BMI) ≈ mean(weight) / (mean(height)/100)²"
    variables: [bmi, weight_kg, height_cm]
    severity: WARNING

  fev1_lt_fvc:
    description: "FEV1 is generally less than FVC"
    check: "mean(FEV1) < mean(FVC)"
    variables: [fev1, fvc]
    severity: WARNING

  postbd_ge_prebd_fev1:
    description: "Post-BD FEV1 generally >= Pre-BD FEV1 (bronchodilator response)"
    check: "mean(post_FEV1) >= mean(pre_FEV1)"
    variables: [fev1]
    severity: WARNING
    notes: "Aggregate only — individual variation expected"

  friedewald:
    description: "LDL ≈ TC - HDL - TG/5 within ±15%"
    check: "mean(LDL) ≈ mean(TC) - mean(HDL) - mean(TG)/5"
    variables: [ldl, total_cholesterol, hdl, triglycerides]
    severity: WARNING
    notes: "Only valid when TG < 400 mg/dL"
