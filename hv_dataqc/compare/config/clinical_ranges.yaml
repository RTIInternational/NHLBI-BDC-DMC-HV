# hv_dataqc clinical ranges configuration
# =========================================
# Per-variable plausible ranges for flagging impossible/suspicious values.
# Used by check_clinical_ranges.py and compare_source_harmonized.py.
#
# Format:
#   variable_name:
#     unit: <UCUM unit string>
#     plausible_lo: <minimum clinically plausible value>
#     plausible_hi: <maximum clinically plausible value>
#     red_flag_lo: <value below which is clearly impossible>
#     red_flag_hi: <value above which is clearly impossible>
#     notes: <optional context>
#
# Sources: clinical reference ranges, NHANES distributions, epidemiological norms.
# These are intentionally WIDE to avoid false positives — they catch data errors
# and unit mistakes, not clinical outliers.

# ── Anthropometrics ──────────────────────────────────────────────────────────
height_cm:
  unit: cm
  plausible_lo: 120
  plausible_hi: 220
  red_flag_lo: 50
  red_flag_hi: 250
  notes: "Adult standing height. <120 suggests pediatric or wheelchair. >220 extremely rare."
  oba_codes: ["OBA:VT0001253"]
  omop_codes: []
  common_phv_names: ["HEIGHT", "HT_CM", "STANDING_HEIGHT", "HTCM"]

weight_kg:
  unit: kg
  plausible_lo: 30
  plausible_hi: 250
  red_flag_lo: 15
  red_flag_hi: 350
  notes: "Adult body weight. Extreme obesity can reach 250kg."
  oba_codes: ["OBA:VT0001259"]
  omop_codes: []
  common_phv_names: ["WEIGHT", "WT_KG", "BODY_WEIGHT", "WGTKG"]

bmi:
  unit: "kg/m2"
  plausible_lo: 12
  plausible_hi: 70
  red_flag_lo: 8
  red_flag_hi: 100
  notes: "BMI. <15 severe underweight, >50 morbid obesity."
  oba_codes: ["OBA:2045455"]
  omop_codes: []
  common_phv_names: ["BMI", "BMI_CM01", "BODY_MASS_INDEX"]

waist_circumference:
  unit: cm
  plausible_lo: 50
  plausible_hi: 200
  red_flag_lo: 30
  red_flag_hi: 250
  oba_codes: ["OBA:VT0100693"]
