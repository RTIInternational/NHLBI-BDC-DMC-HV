# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Genetic epidemiology of COPD with deep pulmonary phenotyping"
  design: "Multi-center longitudinal observational study of smokers and controls"
  population: "~10,300 current/former smokers and controls, non-Hispanic white and African American"
  key_strengths: 
    - "Deep COPD phenotyping combining genetics, CT imaging, and spirometry"
    - "Quantitative CT imaging with standardized protocols"
    - "Longitudinal follow-up at 5-year and 10-year intervals"
    - "Extensive genetic and biomarker data"
    
harmonization_considerations:
  - "Disease-specific cohort vs. general population design"
  - "Pulmonary-focused variables may lack cardiovascular counterparts"
  - "CT scanner and protocol standardization across sites"
  - "Smoking exposure harmonization with other cohorts"
