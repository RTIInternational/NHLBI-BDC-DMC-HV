# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "COPD subpopulation identification and intermediate outcome measure validation"
  design: "Prospective multi-center longitudinal cohort (12 clinical centers)"
  population: "~2,981 participants: never-smokers, smokers without COPD, mild/moderate COPD, severe COPD"
  enrollment_strata:
    - stratum: 1
      label: "Never-Smokers"
      criteria: "<1 pack-year, FEV1/FVC>0.7, FVC>LLN"
      target_n: 200
    - stratum: 2
      label: "Smokers without COPD"
      criteria: ">20 pack-years, post-BD FEV1/FVC>0.7, FVC>LLN"
      target_n: 900
    - stratum: 3
      label: "Mild/Moderate COPD"
      criteria: ">20 pack-years, post-BD FEV1/FVC<0.7, FEV1>50% pred"
      target_n: 1500
    - stratum: 4
      label: "Severe COPD"
      criteria: ">20 pack-years, post-BD FEV1/FVC<0.7, FEV1<50% pred"
      target_n: 600
  key_strengths: 
    - "Stratified enrollment across full COPD severity spectrum"
    - "Deep molecular fingerprinting and phenotyping for subpopulation identification"
    - "Standardized multi-center CT imaging with centralized reading"
    - "Bronchoscopy substudy (n=251) with BAL, brushings, biopsies"
    - "EXACT-PRO exacerbation monitoring in dedicated substudy (n=204)"
    - "Repeatability substudy (n=98) for measurement reliability"
  substudies:
    - name: "Bronchoscopy and Immunophenotyping"
      participants: 251
      description: "BAL, epithelial brushings, bronchial biopsies across all strata"
    - name: "Repeatability"
      participants: 98
      description: "Full baseline visit repeated for measurement reliability"
    - name: "Exacerbation"
      participants: 204
      description: "Prospective observation with EXACT-PRO diary and event-triggered visits"
    - name: "SPIROMICS Genetic and Genomics"
      phs: "phs002399.v1.p1"
      description: "Genomic substudy with WGS data"
  clinical_centers:
    - "Columbia University"
    - "Temple University"
    - "Johns Hopkins University"
    - "Wake Forest University"
    - "University of Michigan"
    - "University of Illinois at Chicago"
    - "University of Iowa"
    - "University of Utah"
    - "National Jewish Health"
    - "University of Alabama at Birmingham"
    - "University of California at San Francisco"
    - "University of California at Los Angeles"
  reading_centers:
    radiology: "University of Iowa"
    pft: "University of California at Los Angeles"
    genomics_informatics: "University of North Carolina at Chapel Hill"
    
harmonization_considerations:
  - "Stratified enrollment (not population-based) affects prevalence/distribution comparisons"
  - "Disease-focused cohort enriched for COPD severity"
  - "Small never-smoker control arm (n≈200)"
  - "Substudy-specific variables have different sample sizes and visit schedules"
  - "Multi-site CT scanner heterogeneity requires QC attention"
  - "Close alignment with COPDGene design but different enrollment criteria (>20 vs >10 pack-years)"
  - "COPD-specific exclusions (BMI>40, prior lung surgery/transplant) affect comparability"
  - "Visit structure: Baseline + 3 annual visits (not all procedures at every visit)"
