# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Cardiovascular disease risk factors, incidence, and prognosis in adults 65+"
  design: "Prospective population-based longitudinal cohort of older adults"
  population: "~5,888 community-dwelling adults aged 65+ from four US communities"
  key_strengths: 
    - "Largest community-based cohort focused on cardiovascular disease in elderly"
    - "Comprehensive subclinical disease assessment (carotid, ABI, echo)"
    - "Long-term follow-up with event adjudication and mortality tracking"
    - "Frailty and functional assessment measures"
    
harmonization_considerations:
  - "Elderly population with different clinical thresholds and reference ranges"
  - "Subclinical disease measures unique to CHS design"
  - "High comorbidity and polypharmacy in elderly participants"
  - "Frailty and functional status measures not found in younger cohorts"
