# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Young adult cardiovascular risk development (18-30 years at baseline)"
  design: "Longitudinal cohort with long-term follow-up"
  population: "Multi-ethnic, community-based young adult cohort"
  key_strengths: 
    - "Early adult baseline cardiovascular measures"
    - "Long-term cardiovascular risk trajectory data"
    - "Young adult to mid-life cardiovascular development"
    
harmonization_considerations:
  - "Age-specific measurement protocols different from older cohorts"
  - "Early-stage risk factors vs. established cardiovascular disease"
  - "Longitudinal design requires careful visit structure mapping"
  - "Unique young adult perspective complements older cohort studies"

# Missing Data Convention (confirmed 2026-02-26)
# See: memory/CARDIA-Missing-Data-Assessment.md
missing_value_conventions:
    - code: "M"
      meaning: "Missing / Not Ascertained"
      scope: "Study-wide, predominantly in self-report and medical history questionnaire variables"
      numeric_code_assigned: false
      prevalence: "57 of 134 variables in A4F09GEN; also confirmed in A4F01, A4F02 datasets"
      absent_from: "Laboratory-measured variables (e.g., A4CHEM)"
      handling: "Convert M → null before value mapping or type casting"
      distinction_from_nulls: "dbGaP nulls = skip-logic (structurally absent); M = operationally missing (question reached but not answered)"
      documentation_gap: "dbGaP refers to external CARDIA codebook at cardia.dopm.uab.edu not submitted to dbGaP"