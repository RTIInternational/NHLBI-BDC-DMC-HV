# =============================================================================
# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Major causes of death, disability, and poor quality of life in postmenopausal women"
  design: "Multi-component study with randomized clinical trials and observational study"
  population: "~161,808 postmenopausal women aged 50-79 from 40 US clinical centers"
  key_strengths: 
    - "Largest women's health study ever conducted"
    - "Both clinical trial and observational components"
    - "Hormone therapy, dietary modification, and calcium/vitamin D interventions"
    - "Long-term follow-up through extension studies"
    
harmonization_considerations:
  - "All-female cohort vs. mixed-sex studies"
  - "Clinical trial intervention effects on biomarker variables"
  - "Massive scale (~161K participants) with complex multi-arm design"
  - "CT vs. OS component distinction for variable interpretation"
