# STUDY-SPECIFIC NOTES
# =============================================================================
study_characteristics:
  focus: "Subclinical CVD prevalence, progression, and risk factors across four ethnic groups"
  design: "Multi-center, multi-ethnic prospective cohort, CVD-free at enrollment"
  population: "~6,814 adults aged 45-84, White, African American, Hispanic, Chinese American"
  key_strengths: 
    - "Multi-ethnic design with four racial/ethnic groups"
    - "Advanced imaging (CT, cardiac MRI, carotid ultrasound)"
    - "CVD-free at baseline enabling subclinical disease progression studies"
    - "Extensive ancillary studies (Air, Lung, Family)"
    
harmonization_considerations:
  - "CVD-free baseline design differs from other cohorts"
  - "Multi-ethnic design with four discrete racial/ethnic groups"
  - "Advanced imaging protocols requiring standardization"
  - "Ancillary study variables may extend available data"
