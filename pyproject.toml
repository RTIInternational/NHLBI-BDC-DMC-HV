[project]
name = "priority_variables_transform"
version = "0.1.0"
description = "Using python code from LLM to convert linkml-map files from priority_variables to class_derivation format"
authors = [
    {name = "Sigfried Gold"}
]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.12,<=3.13"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pandas>=2.3.0,<3.0.0",
    "gspread>=6.2.1,<7.0.0",
    "gspread-dataframe>=4.0.0,<5.0.0",
    "tabulate>=0.9.0,<0.10.0",
    "linkml-map @ git+https://github.com/linkml/linkml-map.git@main"
]


[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
