- class_derivations:
    Condition:
      populated_from: pht001117
      slot_derivations:
        # pht001117 has one row per relative and every row is emitted. Spouse (fhxRel2 1), missing (-9) and
        # rows not confirmed as a blood relative (fhxbrel2 phv00085753 not 1) get UNKNOWN status and no relationship.
        # No age: age_at_condition_start/end are the participant's age, and these ages are the relative's (#847).
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00085751}) + ":MESA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00085751}) + ":MESA CLASSIC EXAM 2")'
        condition_concept:
          value: MONDO:0005098
          range: string
        condition_status:
          expr: case(({phv00085752} == 1, 'UNKNOWN'), ({phv00085752} == -9, 'UNKNOWN'), ({phv00085753} != 1, 'UNKNOWN'), ({phv00085760} == 0, 'ABSENT'), ({phv00085760} == 1, 'HISTORICAL'), (True, 'UNKNOWN'))
        condition_provenance:
          value: PATIENT_SELF_REPORT
          range: string
        relationship_to_participant:
          expr: case(({phv00085753} != 1, None), ({phv00085752} == 2, 'NATURAL_MOTHER'), ({phv00085752} == 3, 'NATURAL_FATHER'), ({phv00085752} == 4, 'NATURAL_SIBLING'), ({phv00085752} == 5, 'NATURAL_CHILD'))
        # associated_evidence:
        #   value: "self-report questionnaire"
        #   range: string
