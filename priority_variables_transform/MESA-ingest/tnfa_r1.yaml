- class_derivations:
    MeasurementObservation:
      populated_from: pht001116
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00084441}) + ":MESA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00084441}) + ":MESA CLASSIC EXAM 1")'
        age_at_observation:
          expr: '{phv00084442} * 365'
        observation_type:
          value: OBA:2051975
        method_type:
          value: "blood assay"
          range: string
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht001116
              slot_derivations:
                value_decimal:
                  expr: 'case((is_numeric({phv00085029}) and {phv00085029} != -888 and {phv00085029} != -555, {phv00085029}), ({phv00085029} == -555, 5000.0))'
                operator:
                  expr: 'case(({phv00085029} == -555, "GREATER_THAN"))'
                unit:
                  value: pg/mL
