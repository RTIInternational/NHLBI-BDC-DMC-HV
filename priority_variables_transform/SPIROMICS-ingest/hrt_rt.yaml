- class_derivations:
    MeasurementObservation:
      populated_from: pht013308
      slot_derivations:
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00528692}) + ":" + case(({phv00528696}
            == ''VISIT_1'', ''SPIROMICS Visit 1''), ({phv00528696} == ''VISIT_2'', ''SPIROMICS
            Visit 2''), ({phv00528696} == ''VISIT_3'', ''SPIROMICS Visit 3''), ({phv00528696}
            == ''VISIT_4'', ''SPIROMICS Visit 4'')))'
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00528692}) + ":SPIROMICS")'
        age_at_observation:
          expr: '{phv00528706} * 365'
        observation_type:
          value: OBA:1001087
        body_position:
          value: SITTING_POSITION
        method_type:
          value: average
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht013308
            slot_derivations:
              value_decimal:
                populated_from: phv00528714
              unit:
                value: '{beats}/min'
