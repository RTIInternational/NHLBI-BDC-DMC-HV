      slot_derivations:
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00528692}) + ":" + case(({phv00528696}
            == ''VISIT_1'', ''SPIROMICS Visit 1''), ({phv00528696} == ''VISIT_2'', ''SPIROMICS
            Visit 2''), ({phv00528696} == ''VISIT_3'', ''SPIROMICS Visit 3''), ({phv00528696}
            == ''VISIT_4'', ''SPIROMICS Visit 4'')))'
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00528692}) + ":SPIROMICS")'
        age_at_observation:
          expr: '{phv00528706} * 365'
        observation_type:
          value: OBA:VT0001259
        value_quantity:
