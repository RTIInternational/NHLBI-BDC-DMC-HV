- class_derivations:
    MeasurementObservation:
      populated_from: pht004098
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00206655}) + ":ARIC")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00206655}) + ":ARIC EXAM 1")'
        observation_type:
          value: OBA:2041536
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht004098
            slot_derivations:
              value_decimal:
                # Factor VIII C value (string type); guard against ARIC letter sentinels and non-numeric strings
                expr: 'None if {phv00206649} is None or str({phv00206649}) in ("A", "O", "M", "R", "N", "U", "T", "L", "H", "", ".", "NA", "nan", "NaN") else float({phv00206649}) * 0.01'
              unit:
                value: "[IU]/mL"
