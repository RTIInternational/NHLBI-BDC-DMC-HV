- class_derivations:
    MeasurementObservation:
      populated_from: pht004098
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00206655}) + ":ARIC")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00206655}) + ":ARIC EXAM 1")'
        observation_type:
          value: OBA:2041536
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht004098
              slot_derivations:
                value_decimal:
                  # Factor VIII C value (string type). ARIC sentinel codes (A, O, M, R, N, U, T, L, H) and any
                  # other non-numeric value become null; "nan"/"NaN" parse as numbers so they are excluded too.
                  expr: 'float({phv00206649}) * 0.01 if is_numeric({phv00206649}) and str({phv00206649}) not in ("nan", "NaN") else None'
                unit:
                  value: "[IU]/mL"
