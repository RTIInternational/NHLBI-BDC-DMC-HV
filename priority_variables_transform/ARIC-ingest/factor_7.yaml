- class_derivations:
    MeasurementObservation:
      populated_from: pht004098
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00206655}) + ":ARIC")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00206655}) + ":ARIC EXAM 1")'
        observation_type:
          value: OBA:2041535
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht004098
              slot_derivations:
                value_decimal:
                  # ARIC sentinel codes (A, O, M, R, N, U, T, L, H) and any other non-numeric value become null;
                  # "nan"/"NaN" parse as numbers so they are excluded too.
                  expr: 'float({phv00206651}) if is_numeric({phv00206651}) and str({phv00206651}) not in ("nan", "NaN") else None'
                unit:
                  value: "%{normal}"
