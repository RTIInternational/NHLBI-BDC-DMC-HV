# Smoking status: single block using TBEA1 (100+ cigs lifetime) as primary screener
# and TBEA3 (present smoking) for current/former classification.
# TBEA1 (phv00258106): 0=No → Never Smoked; 1=Yes → check TBEA3
# TBEA3 (phv00258107): 1=Daily, 2=Some days → Current; 3=Not at all → Former
# OMOP codes verified against Athena 2026-03-23.
- class_derivations:
    Observation:
      populated_from: pht004715
      slot_derivations:
        associated_participant:
          populated_from: phv00226250
        associated_visit:
          value: HCHS EXAM
          range: string
        age_at_observation:
          expr: '{phv00226251} * 365'
        observation_type:
          value: OMOP:4282779
          range: string
        value_enum:
          expr: case(({phv00258106} == 0, "OMOP:45883537"), ({phv00258107} == 1,
            "OMOP:40766945"), ({phv00258107} == 2, "OMOP:40766945"), ({phv00258107}
            == 3, "OMOP:45883458"), (True, "OMOP:45885135"))
