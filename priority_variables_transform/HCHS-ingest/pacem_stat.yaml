- class_derivations:
    Procedure:
      populated_from: pht004715
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00226250}) + ":HCHS")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00226250}) + ":HCHS EXAM")'
        age_at_procedure:
          expr: '{phv00226251} * 365'
        procedure_concept:
          expr: case(({phv00226273} == 'Pacemaker', 'OMOP:45772840'))
        procedure_provenance:
          expr: case(({phv00226273} == 'Pacemaker', 'CASE_REPORT_FORM'))
        procedure_status:
          expr: case(({phv00226273} == 'Pacemaker', 'PRESENT'), (True, 'ABSENT'))
