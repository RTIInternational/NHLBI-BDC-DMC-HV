- class_derivations:
    Visit:
      populated_from: pht004715
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00226250}) + ":HCHS EXAM")'
        name:
          value: HCHS EXAM
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00226250}) + ":HCHS")'
        age_at_visit_start:
          expr: '{phv00226251} * 365'
        age_at_visit_end:
          expr: '{phv00226251} * 365'
        visit_provenance:
          value: STUDY_RECORD
          range: string
        visit_category:
          value: STUDY_SITE_VISIT
          range: string
