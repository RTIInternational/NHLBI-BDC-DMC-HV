# JHS PAD: Peripheral Arterial Disease from Annual Follow-Up self-report
# Source: pht008725.v2 (afulong), Annual Follow-Up
# Variable: phv00400971.v1 (PADEVER) -- "Has a doctor ever said that you have
#   peripheral vascular disease or intermittent claudication?"
#   Observed: N=19,750 (98.1%), Y=308 (1.5%), U=78 (0.4%)
# Coded values are mapped directly; no derived criterion is applied.
#
# Ankle-Brachial Index (pht008729 phv00401122) is deliberately NOT used here.
# ABI is a valid measurement and a recognised indicator of PAD, but deriving a
# PAD diagnosis from an ABI threshold is a clinical assertion this project is
# not authorised to make. Unlike ARIC, JHS publishes no study-derived PAD flag
# from ABI -- only the raw index. ABI will be harmonized as a
# MeasurementObservation in a future round.
- class_derivations:
    Condition:
      populated_from: pht008725
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00400849}) + ":JHS")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00400849}) + ":JHS AFU")'
          range: string
        condition_concept:
          value: MONDO:0005386
          range: string
        condition_status:
          populated_from: phv00400971
          value_mappings:
            N: ABSENT
            Y: HISTORICAL
            U: UNKNOWN
        condition_provenance:
          value: PATIENT_SELF_REPORT_DR_CONFIRMED
          range: string
        # associated_evidence:
        #   value: "Annual Follow-Up"
        relationship_to_participant:
          value: ONESELF
          range: string
