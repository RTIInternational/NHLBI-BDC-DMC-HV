- class_derivations:
    MeasurementObservation:
      populated_from: pht001563
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00112654}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00112654}) + ":CARDIA YEAR 0")'
        # age_at_observation:
          # expr: "{nan} * 365"
        observation_type:
          value: OBA:2045301
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht001563
            slot_derivations:
              value_decimal:
                expr: "({phv00112688} / {phv00112687}) * 10"
              unit:
                value: "pg/{cell}"
