- class_derivations:
    Demography:
      populated_from: pht001559
      slot_derivations:
        associated_participant:
          populated_from: phv00112417
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00112417}) + ":CARDIA YEAR 0")'
        sex:
          populated_from: phv00112420
          value_mappings:
            '2': OMOP:8532
            '1': OMOP:8507
        ethnicity:
          populated_from: phv00112422
          value_mappings:
            '5': OMOP:38003564
            '4': OMOP:38003564
            '3': OMOP:38003563
# Race block uses B2REF (pht001645) — the official CARDIA race reference file
# sourced from the Exam 2 clinical visit record. Race is a stable baseline
# characteristic; associated_visit is deliberately anchored to CARDIA YEAR 0
# (not YEAR 2) for cross-cohort consistency with demographic baselines.
# Covers all 3,622 participants with only codes 4 (Black) and 5 (White).
# Preferred over A4F01 telephone screen which has 9 Hispanic participants
# that fall through unmapped.
- class_derivations:
    Demography:
      populated_from: pht001645
      slot_derivations:
        associated_participant:
          populated_from: phv00115110
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00115110}) + ":CARDIA YEAR 0")'
        race:
          populated_from: phv00115113
          value_mappings:
            '5': OMOP:8527
            '4': OMOP:8516
