- class_derivations:
    MeasurementObservation:
      populated_from: pht001563
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00112654}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00112654}) + ":CARDIA YEAR 0")'
        # age_at_observation:
          # expr: "{nan} * 365"
        observation_type:
          value: OMOP:37208698
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht001563
              slot_derivations:
                value_decimal:
                  expr: "None if str({phv00112694}) == 'M' else float({phv00112694})"
                unit:
                  value: "%{WBCs}"
