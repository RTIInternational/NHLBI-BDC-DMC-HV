- class_derivations:
    DrugExposure:
      populated_from: pht001805
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00119638}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00119638}) + ":CARDIA YEAR 10")'
        drug_concept:
          expr: 'case(({phv00119640} == 1, "ATC:C03"))'
        exposure_provenance:
          value: PATIENT SELF-REPORTED MEDICATION
          range: string
        exposure_status:
          populated_from: phv00119640
          value_mappings:
            '0': ABSENT
            '1': PRESENT
