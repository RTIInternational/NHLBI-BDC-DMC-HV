- class_derivations:
    MeasurementObservation:
      populated_from: pht003298
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00190551}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00190551}) + ":CARDIA YEAR 20")'
        age_at_observation:
          expr: "None if str({phv00190622}) == 'M' else float({phv00190622}) * 365"
        observation_type:
          value: OBA:VT0000222
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht003298
            slot_derivations:
              value_decimal:
                expr: "None if str({phv00190607}) == 'M' else float({phv00190607})"
              unit:
                value: "10*3/uL"
                range: string
