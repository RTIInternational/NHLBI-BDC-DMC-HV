- class_derivations:
    MeasurementObservation:
      populated_from: pht003298
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00190551}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00190551}) + ":CARDIA YEAR 20")'
        age_at_observation:
          expr: "None if str({phv00190622}) == 'M' else float({phv00190622}) * 365"
        observation_type:
          value: OMOP:4087501
        method_type:
          value: "anthropometry"
        body_position:
          value: STANDING_POSITION
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht003298
            slot_derivations:
              value_decimal:
                expr: "None if str({phv00190567}) == 'M' else float({phv00190567})"
              unit:
                value: "{ratio}"
                range: string
