- class_derivations:
    MeasurementObservation:
      populated_from: pht001563
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00112654}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00112654}) + ":CARDIA YEAR 0")'
        # age_at_observation:
          # expr: "{nan} * 365"
        observation_type:
          value: OBA:VT0000717
        method_type:
          value: "blood assay"
        value_quantity:
          object_derivations:
          - class_derivations:
              Quantity:
                populated_from: pht001563
                slot_derivations:
                  value_decimal:
                    expr: "float({phv00112691}) / 100.0 * float({phv00112686})"
                  unit:
                    value: "10*3/uL"
