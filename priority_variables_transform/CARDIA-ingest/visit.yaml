# CARDIA YEAR 15 visits: multiple tables cover this exam year with different participant keys.
# pht001857 (F2F20), pht001854 (F2EBCT), pht001855 (F2F03), pht001874 (Z33E06) all use
# standard CARDIA Individual_ID — uuid5 produces matching Visit IDs across these tables.
# pht003298 (HeartGO_CARDIA) uses HeartGO New_SUBJID (GENEVA subject ID) — these produce
# separate Visit entities that do not cross-link with standard Individual_ID-keyed tables.
# pht003298 (HeartGO_CARDIA) uses phv00190622 (ESP_age_at_serum_creatinine) as exam-age proxy;
# all other YEAR 20 tables lack a direct exam-age variable and omit age_at_visit.
- class_derivations:
    Visit:
      populated_from: pht001857
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00120993}) + ":CARDIA YEAR 15")'
        name:
          value: CARDIA YEAR 15
        visit_category:
          value: HEALTH_EXAMINATION
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00120993}) + ":CARDIA")'
