# CARDIA Medical History visit: pht001869 (Y1MORB06) and pht001871 (YM106) are
# companion hospitalization-review tables representing the same conceptual visit.
# Both use Individual_ID as participant key, so uuid5 produces the same Visit ID
# for any given participant across both tables — intentional deduplication by design.
# Both blocks are retained so coverage is not lost for participants appearing in
# only one of the two tables.
- class_derivations:
    Visit:
      populated_from: pht001869
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00121257}) + ":CARDIA MEDICAL HISTORY")'
        name:
          value: CARDIA MEDICAL HISTORY
        visit_category:
          value: UNKNOWN
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00121257}) + ":CARDIA")'
