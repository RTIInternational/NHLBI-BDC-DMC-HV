- class_derivations:
    MeasurementObservation:
      populated_from: pht001563
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00112654}) + ":CARDIA")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00112654}) + ":CARDIA YEAR 0")'
        # age_at_observation:
          # expr: "{nan} * 365"
        observation_type:
          value: OBA:VT0003179
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht001563
              slot_derivations:
                value_decimal:
                  expr: "None if str({phv00112690}) in ('M', 'L', 'H', '') else float({phv00112690})"
                unit:
                  value: "10*3/uL"
                  range: string
