- class_derivations:
    Visit:
      populated_from: pht010057
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00429048}) + ":LTRC Baseline")'
        name:
          value: LTRC Baseline
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00429048}) + ":LTRC")'
        visit_category:
          value: STUDY_SITE_VISIT
        age_at_visit_start:
          expr: '{phv00429049} * 365'
        age_at_visit_end:
          expr: '{phv00429049} * 365'
        visit_provenance:
          value: STUDY_RECORD
          range: string
