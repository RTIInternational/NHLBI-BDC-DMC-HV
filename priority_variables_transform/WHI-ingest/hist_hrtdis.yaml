- class_derivations:
    Condition:
      populated_from: pht006223
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00283451}) + ":WHI")'
        age_at_condition_start:
          expr: 'case(({phv00283530} == 1, ({phv00078437} * 365) + {phv00283452}))'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00283451}) + ":WHI UNC HEART FAILURE DETAILS")'
          range: string
        condition_concept:
          value: MONDO:0002869
          range: string
        condition_status:
          populated_from: phv00283530
          value_mappings:
            '0': ABSENT
            '1': PRESENT
        condition_provenance:
          value: HEALTH_RECORD
          range: string
        # associated_evidence:
        #   value: "hospital record abstraction"
        relationship_to_participant:
          value: ONESELF
          range: string
