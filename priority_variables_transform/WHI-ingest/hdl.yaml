          # expr: "{nan} * 365"
        observation_type:
          value: OBA:VT0000184
        method_type:
          value: "blood assay"
        value_quantity:
          class_derivations:
          - name: Quantity
            populated_from: pht000987
            slot_derivations:
              value_decimal:
                populated_from: phv00077388
              unit:
                value: "mg/dL"
