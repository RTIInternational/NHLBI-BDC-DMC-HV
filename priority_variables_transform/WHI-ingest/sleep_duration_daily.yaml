- class_derivations:
    MeasurementObservation:
      populated_from: pht006214
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00282977}) + ":WHI")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00282977}) + ":WHI LQ 155")'
        # age_at_observation:
          # expr: "{nan} * 365"
        observation_type:
          value: OBA:2040171
        method_type:
          value: "questionnaire"
        # Encoded answer, not hours: codes 2-5 are single hours (6-9). Codes 1 "5 or less"
        # and 6 "10 or more" are bounds: 5 and 10 with operator <= and >=; no unit without a value.
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht006214
              slot_derivations:
                value_decimal:
                  populated_from: phv00283093
                  value_mappings:
                    '1': 5
                    '2': 6
                    '3': 7
                    '4': 8
                    '5': 9
                    '6': 10
                operator:
                  expr: "case((str({phv00283093}) == '1', 'LESS_THAN_OR_EQUAL_TO'), (str({phv00283093}) == '6', 'GREATER_THAN_OR_EQUAL_TO'))"
                unit:
                  expr: "case((str({phv00283093}) in ['1', '2', '3', '4', '5', '6'], 'h'))"
