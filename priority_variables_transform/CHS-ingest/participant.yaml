- class_derivations:
    Participant:
      populated_from: pht001447
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00098755}) + ":CHS")'
        identity:
          expr: 'str({phv00098755})'
        member_of_research_study:
          value: 'Cardiovascular Health Study (CHS) Cohort'
        associated_person:
          expr: 'uuid5("https://w3id.org/bdchm/Person", str({dbGaP_Subject_ID}))'