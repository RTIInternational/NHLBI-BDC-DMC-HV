                  ({phv00098800} == "COLORED", "BLACK_OR_AFRICAN_AMERICAN"),
                  ({phv00098800} == "BLACK/INDIAN", "MORE_THAN_ONE_RACE"),
                  ({phv00098800} == "BLACK/AMER IND", "MORE_THAN_ONE_RACE")
