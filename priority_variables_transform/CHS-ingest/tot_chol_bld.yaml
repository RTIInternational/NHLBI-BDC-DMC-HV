- class_derivations:
    MeasurementObservation:
      populated_from: pht001452
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00100285}) + ":CHS")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00100285}) + ":CHS BASELINE BOTH")'
        age_at_observation:
          expr: '{phv00100487} * 365'
        observation_type:
          value: OBA:VT0000180
          range: string
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht001452
              slot_derivations:
                value_decimal:
                  populated_from: phv00100491
                unit:
                  value: mg/dL
                  range: string
        method_type:
          value: adjusted
          range: string
