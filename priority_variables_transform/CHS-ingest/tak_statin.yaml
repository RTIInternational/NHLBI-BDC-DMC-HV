- class_derivations:
    DrugExposure:
      populated_from: pht001452
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Person", str({phv00100285}) + ":CHS")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00100285}) + ":CHS BASELINE BOTH")'
        drug_concept:
          expr: 'case(({phv00100594} == 1, "ATC:C10A"))'
        exposure_provenance:
          value: PATIENT_SELF_REPORTED_MEDICATION
          range: string
