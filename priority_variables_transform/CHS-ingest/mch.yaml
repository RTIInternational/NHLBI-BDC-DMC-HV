# CHS does not include MCH (mean corpuscular hemoglobin) as a CBC analyte.
# CHS standard CBC reports only WBC, Hgb (HEMOGL23), Hct (HEMATO23), and
# Platelet (PLATE23). Exhaustive search of all 65 CHS data dictionaries
# confirmed no MCH variable exists. File intentionally empty.
