# All four FHS sources are CDI "OTHER PERIPHERAL VASCULAR DISEASE", so this file
# emits PVD (MONDO:0005294), not PAD. Claudication-derived blocks removed per HV #801.
# Offspring Exam 5 (pht000034): CDI-Other Peripheral Vascular Disease (phv00009530)
# Replaces non-functional Offspring Exam 8 block (pht000747) — "FHS OFFSPRING EXAM 8"
# visit label does not exist in the pipeline output. Exam 5 is the earliest Offspring
# exam with a clinical diagnostic impression for PVD (n~3,677).
# Codes: 0=NO, 1=YES OLD, 2=YES NEW, 3=YES RECURRENT, 4=MAYBE
- class_derivations:
    Condition:
      populated_from: pht000034
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00009579}) + ":FHS")'
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00009579}) + ":FHS OFFSPRING EXAM 5")'
        condition_concept:
          value: MONDO:0005294
          range: string
        condition_status:
          populated_from: phv00009530
          value_mappings:
            '0': ABSENT
            '1': PRESENT
            '2': PRESENT
            '3': PRESENT
            '4': UNKNOWN
        condition_provenance:
          value: WORKING_DIAGNOSIS
          range: string
        associated_evidence:
          value: Clinical Diagnostic Impression
          range: string
        relationship_to_participant:
          value: ONESELF
          range: string
