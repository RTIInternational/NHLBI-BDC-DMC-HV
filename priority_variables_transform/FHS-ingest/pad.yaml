# Original cohort: pht000309 (Sequence of Events) with cross-table join to pht003099
# EVENT code 30 = "IC, first episode only" (Intermittent Claudication)
# DATE (phv00036471) = days from baseline; DATE <= 0 means event at or before baseline
# This recovers ~5,000 Original cohort participants who have no questionnaire-based
# PAD data but have adjudicated cardiovascular event records.
- class_derivations:
    Condition:
      populated_from: pht000309
      joins:
        pht003099:
          source_key: phv00036472
          lookup_key: phv00177926
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00036472}) + ":FHS")'
        associated_visit:
          expr: >
            uuid5("https://w3id.org/bdchm/Visit", str({phv00036472}) + ":" +
            case(
              ({phv00036470} == 0, "FHS ORIGINAL EXAM 4"),
              ({phv00036470} == 1, "FHS OFFSPRING EXAM 1"),
              ({phv00036470} == 2, "FHS NEW OFFSPRING SPOUSE EXAM 1"),
              ({phv00036470} == 3, "FHS GENERATION 3 EXAM 1"),
              ({phv00036470} == 7, "FHS OMNI 1 EXAM 1"),
              ({phv00036470} == 72, "FHS OMNI 2 EXAM 1"),
              (True, "FHS UNKNOWN VISIT")
            ))
        age_at_observation:
          expr: '{pht003099.phv00177930} * 365'
        age_at_condition_start:
          expr: "case(({phv00036469} == 30 and int({phv00036471}) <= 0, ({pht003099.phv00177930} * 365) + int({phv00036471})))"
        condition_concept:
          value: MONDO:0005386
          range: string
        condition_status:
          expr: >
            case(
              ({phv00036469} == 30 and int({phv00036471}) <= 0, "PRESENT"),
              (True, None)
            )
        condition_provenance:
          value: CLINICAL_DIAGNOSIS
          range: string
        associated_evidence:
          value: Adjudicated cardiovascular event (Sequence of Events)
          range: string
        relationship_to_participant:
          value: ONESELF
          range: string
