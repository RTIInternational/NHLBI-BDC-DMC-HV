# FHS Angina — adjudicated cardiovascular events from pht000309 (Sequence of Events)
# Removed 4 Rose Questionnaire single-question blocks (G3A169 = "chest discomfort with
# exertion or excitement") which were overcounting angina 4x (401 vs 104 positives).
# G3A169 is only the first screening question of the Rose Angina Questionnaire, not a
# Rose-positive diagnosis. The DCC phenotype definition (cabg_prior_1.json) uses only
# adjudicated EVENT=6 from the FHS surveillance system, which is the gold standard.
# pht000309 EVENT code 6 = "AP, first episode only"
# DATE (phv00036471) = days from baseline; DATE <= 0 means event at or before baseline
# IDTYPE (phv00036470) maps subcohorts to baseline visits for all FHS cohorts.
- class_derivations:
    Condition:
      populated_from: pht000309
      joins:
        pht003099:
          source_key: phv00036472
          lookup_key: phv00177926
      slot_derivations:
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00036472}) + ":FHS")'
        associated_visit:
          expr: >
            uuid5("https://w3id.org/bdchm/Visit", str({phv00036472}) + ":" +
            case(
              ({phv00036470} == 0, "FHS ORIGINAL EXAM 4"),
              ({phv00036470} == 1, "FHS OFFSPRING EXAM 1"),
              ({phv00036470} == 2, "FHS NEW OFFSPRING SPOUSE EXAM 1"),
              ({phv00036470} == 3, "FHS GENERATION 3 EXAM 1"),
              ({phv00036470} == 7, "FHS OMNI 1 EXAM 1"),
              ({phv00036470} == 72, "FHS OMNI 2 EXAM 1"),
              (True, "FHS UNKNOWN VISIT")
            ))
        age_at_condition_start:
          expr: "case(({phv00036469} == 6 and int({phv00036471}) <= 0, ({pht003099.phv00177930} * 365) + int({phv00036471})))"
        condition_concept:
          value: HP:0001681
          range: string
        condition_status:
          expr: >
            case(
              ({phv00036469} == 6 and int({phv00036471}) <= 0, "PRESENT"),
              (True, None)
            )
        condition_provenance:
          value: CLINICAL_DIAGNOSIS
          range: string
        associated_evidence:
          value: Adjudicated cardiovascular event (Sequence of Events)
          range: string
        relationship_to_participant:
          value: ONESELF
          range: string
