        condition_concept:
          value: OMOP:4336464
          range: string
        condition_status:
          populated_from: phv00009390
          value_mappings:
            '0': ABSENT
            '1': PRESENT
            '2': UNKNOWN
        condition_provenance:
          value: PATIENT_SELF-REPORTED_CONDITION
