- class_derivations:
    Participant:
      populated_from: pht003099
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00177926}) + ":FHS")'
        identity:
          expr: 'str({phv00177926})'
        member_of_research_study:
          expr: 'case(({phv00177928} == 0, "phs000007-original"), ({phv00177928} == 1, "phs000007-offspring"), ({phv00177928} == 2, "phs000007-new-offspring-spouse"), ({phv00177928} == 3, "phs000007-gen3"), ({phv00177928} == 7, "phs000007-omni1"), ({phv00177928} == 72, "phs000007-omni2"), (True, "phs000007"))'
        associated_person:
          expr: 'uuid5("https://w3id.org/bdchm/Person", str({dbGaP_Subject_ID}))'
