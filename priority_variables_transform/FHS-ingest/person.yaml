- class_derivations:
    Person:
      populated_from: pht003099
      joins:
        pht003317:
          source_key: phv00177926
          lookup_key: phv00190826
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Person", str({dbGaP_Subject_ID}))'
        identity:
          expr: 'str({dbGaP_Subject_ID})'
        species:
          value: NCBITaxon:9606
        vital_status:
          expr: 'case(({pht003317.phv00190831} is not None, "OMOP:434489"))'
        age_at_death:
          expr: 'case(({pht003317.phv00190831} is not None, ({phv00177930} * 365) + {pht003317.phv00190831}))'
        # excluded: cause_of_death - pht000094 (UCOD phv00021941, COD1-COD9 phv00021942-phv00021950) carries
        # no ICD-revision variable, so the ICD8/ICD9 prefix the codes need cannot be derived (see #594, #255).
