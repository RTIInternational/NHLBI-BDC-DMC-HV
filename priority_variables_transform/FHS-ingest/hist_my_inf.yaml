# History of MI -- Adjudicated CVD events surveillance approach (pht000309).
# Source: FHS Sequence of Events table (vr_soe_2023_a_1553s).
# Filter: EVENT in {1,2,3,4,5} (MI subtypes) AND DATE <= 0 (before baseline).
# IMPORTANT: Must use expr:case() -- NOT value_mappings -- because pht000309 contains
#   20K+ rows for ALL event types; value_mappings passes unmapped rows through with raw
#   integer condition_concept values, silently corrupting the entire Condition composed spec.
# Replaced: 106 exam-level blocks across 38 PHTs mapping ECG-based MI indicators
#   and self-reported "told by doctor" questions. The exam-level approach had 39.6%
#   structural missingness because ECG MI findings only exist when the ECG shows
#   evidence (normal ECG = null, not "no MI"). Missing Omni 1 and Omni 2 entirely.
#   The surveillance table covers all 6 sub-cohorts via centralized adjudicated review
#   that synthesizes ECG, hospital records, death certificates, and physician reports.
# PHV reference:
#   phv00036472 = shareid (participant ID)
#   phv00036470 = IDTYPE  (sub-cohort: 0=Orig, 1=Offsp, 2=NOS, 3=Gen3, 7=Omni1, 72=Omni2)
#   phv00036469 = EVENT   (event code; 1-5 = MI subtypes)
#   phv00036471 = DATE    (days since Exam 1; <= 0 means before baseline)
# EVENT codes for MI:
#   1 = MI recognized, with diagnostic ECG
#   2 = MI recognized, without diagnostic ECG, with enzymes and history
#   3 = MI recognized, without diagnostic ECG, with autopsy evidence
#   4 = MI unrecognized, silent
#   5 = MI unrecognized, not silent
- class_derivations:
    Condition:
      populated_from: pht000309
      slot_derivations:
        associated_participant:
          populated_from: phv00036472
        associated_visit:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00036472}) + ":" + case(({phv00036470} == 0, ''FHS ORIGINAL EXAM 4''), ({phv00036470} == 1, ''FHS OFFSPRING EXAM 1''), ({phv00036470} == 2, ''FHS NEW OFFSPRING SPOUSE EXAM 1''), ({phv00036470} == 3, ''FHS GENERATION 3 EXAM 1''), ({phv00036470} == 7, ''FHS OMNI 1 EXAM 1''), ({phv00036470} == 72, ''FHS OMNI 2 EXAM 1''), (True, ''FHS UNKNOWN VISIT'')))'
        condition_concept:
          expr: 'case(({phv00036469} in (1, 2, 3, 4, 5) and {phv00036471} <= 0, "MONDO:0005068"))'
        condition_status:
          expr: 'case(({phv00036469} in (1, 2, 3, 4, 5) and {phv00036471} <= 0, "HISTORICAL"))'
        condition_provenance:
          value: CLINICAL_DIAGNOSIS
          range: string
        relationship_to_participant:
          value: ONESELF
          range: string
