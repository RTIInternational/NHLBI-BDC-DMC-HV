# Hypertension treatment (current medication for high blood pressure)
# phv00568929: currmedhighbp - collected P2 P3 (0=No, 1=Yes)
- class_derivations:
    DrugExposure:
      populated_from: pht002239
      slot_derivations:
        associated_visit:
          expr: case(({phv00568798} == 'P2', uuid5('https://w3id.org/bdchm/Visit',
            str({phv00159568}) + ':COPDGene P2')), ({phv00568798} == 'P3',
            uuid5('https://w3id.org/bdchm/Visit', str({phv00159568}) + ':COPDGene P3')),
            ({phv00568798} == 'P3B', uuid5('https://w3id.org/bdchm/Visit',
            str({phv00159568}) + ':COPDGene P3B')), (True, None))
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00159568}) + ":COPDGene")'
        drug_concept:
          value: ATC:C02
        exposure_provenance:
          value: PATIENT SELF-REPORTED MEDICATION
        exposure_status:
          populated_from: phv00568929
          value_mappings:
            '0': ABSENT
            '1': PRESENT
