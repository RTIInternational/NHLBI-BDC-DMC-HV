- class_derivations:
    Visit:
      populated_from: pht002239
      slot_derivations:
        id:
          expr: 'uuid5("https://w3id.org/bdchm/Visit", str({phv00159568}) + ":" + case(({phv00568798} == ''P1'', ''COPDGene P1''), ({phv00568798} == ''P2'', ''COPDGene P2''), ({phv00568798} == ''P3'', ''COPDGene P3''), ({phv00568798} == ''P3B'', ''COPDGene P3B'')))'
        name:
          expr: case(({phv00568798} == 'P1', 'COPDGene P1'), ({phv00568798} == 'P2',
            'COPDGene P2'), ({phv00568798} == 'P3', 'COPDGene P3'), ({phv00568798}
            == 'P3B', 'COPDGene P3B'))
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00159568}) + ":COPDGene")'
        visit_category:
          value: HEALTH_EXAMINATION
        age_at_visit_start:
          expr: '{phv00568808} * 365'
        age_at_visit_end:
          expr: '{phv00568808} * 365'
        visit_provenance:
          value: STUDY_RECORD
          range: string
