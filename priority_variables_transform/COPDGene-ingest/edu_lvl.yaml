# phv00159773 (SchoolCompleted) is "Collected in: P1 P2" per dbGaP, so P3/P3B
# branches were removed -- they would emit NaN value_enum rows.
- class_derivations:
    SdohObservation:
      populated_from: pht002239
      slot_derivations:
        associated_visit:
          expr: case(({phv00568798} == 'P1', uuid5('https://w3id.org/bdchm/Visit',
            str({phv00159568}) + ':COPDGene P1')), ({phv00568798} == 'P2',
            uuid5('https://w3id.org/bdchm/Visit', str({phv00159568}) + ':COPDGene P2')),
            (True, None))
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00159568}) + ":COPDGene")'
        age_at_observation:
          expr: '{phv00568808} * 365'
        observation_type:
          value: EDUCATIONAL_ATTAINMENT
        category:
          value: EDUCATIONAL_ATTAINMENT
        value_enum:
          populated_from: phv00159773
          value_mappings:
            '1': 8TH_GRADE_OR_LESS
            '2': HIGH_SCHOOL_NO_DIPLOMA
            '3': HIGH_SCHOOL_GRADUATE_GED
            '4': SOME_COLLEGE_OR_TECH_NO_DEGREE
            '5': COLLEGE_OR_TECH_WITH_DEGREE
            '6': MASTERS_OR_DOCTORAL_DEGREE
