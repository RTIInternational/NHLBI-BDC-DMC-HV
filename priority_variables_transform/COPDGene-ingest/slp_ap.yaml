# phv00159736 (SleepApnea) / phv00159738 (SleepApAge) are "Collected in: P1 P2" per dbGaP,
# so P3/P3B branches were removed -- null condition_status there would default to ABSENT.
- class_derivations:
    Condition:
      populated_from: pht002239
      slot_derivations:
        associated_visit:
          expr: case(({phv00568798} == 'P1', uuid5('https://w3id.org/bdchm/Visit',
            str({phv00159568}) + ':COPDGene P1')), ({phv00568798} == 'P2',
            uuid5('https://w3id.org/bdchm/Visit', str({phv00159568}) + ':COPDGene P2')),
            (True, None))
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00159568}) + ":COPDGene")'
        age_at_condition_start:
          expr: case(({phv00159736} == 1, {phv00159738} * 365))
        condition_concept:
          value: HP:0010535
        condition_status:
          populated_from: phv00159736
          value_mappings:
            '0': ABSENT
            '1': PRESENT
            '3': UNKNOWN
        condition_provenance:
          value: PATIENT_SELF_REPORT
        # associated_evidence:
        #   value: Medical History Questionnaire
        relationship_to_participant:
          value: ONESELF
