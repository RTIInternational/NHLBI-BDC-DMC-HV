# Alcohol consumption (approximate servings per week)
# phv00568915: alcohol_how_often - collected P3 only
# Source is ordinal frequency (0=Never, 1=Monthly or less, 2=2-4 times/month,
# 3=2-4 times/week, 4=4+ times/week). Converted to approximate servings/week.
- class_derivations:
    MeasurementObservation:
      populated_from: pht002239
      slot_derivations:
        associated_visit:
          expr: case(({phv00568798} == 'P3', uuid5('https://w3id.org/bdchm/Visit',
            str({phv00159568}) + ':COPDGene P3')), ({phv00568798} == 'P3B',
            uuid5('https://w3id.org/bdchm/Visit', str({phv00159568}) + ':COPDGene P3B')),
            (True, None))
        associated_participant:
          expr: 'uuid5("https://w3id.org/bdchm/Participant", str({phv00159568}) + ":COPDGene")'
        age_at_observation:
          expr: '{phv00568808} * 365'
        observation_type:
          value: OMOP:35609491
        value_quantity:
          class_derivations:
          - Quantity:
              populated_from: pht002239
              slot_derivations:
                value_decimal:
                  expr: "case(({phv00568915} == '0', 0), ({phv00568915} == '1',\
                    \ 0), ({phv00568915} == '2', 1), ({phv00568915} == '3', 3),\
                    \ ({phv00568915} == '4', 5))"
                unit:
                  value: '{#}/wk'
