# Template label -> spec label(s) that mean the same variable. Case-insensitive
# matching is automatic, so list only genuine spelling / word-order / wording
# differences here (NOT mere capitalization).
aliases:
  CRP c-reactive protein:
    - c-reactive protein CRP
  Fruit consumption:
    - Fruits
  Vegetable consumption:
    - Vegetables
  Lactate in blood:
    - lactate
  Insulin in blood:
    - insulin_in_blood
  Mean arterial pressure:
    - mean_art_press
  # OMOP:35609491 resolves to "Alcohol" via harmonized_vars.tsv; template
  # uses the fuller "Alcohol Consumption".
  Alcohol Consumption:
    - Alcohol
  # The lymphocyte_ct spec's obs_type (OBA:VT0000717) is not in
  # harmonized_vars.tsv's OBA column, so the label falls back to the stem.
  Lymphocytes count:
    - lymphocyte_ct

# Printed above the trailing block of spec variables that match no template
# row (IL-18, the combined pr_qrs_qt variable, etc.). They are appended after
# a blank separator row so they are clearly distinct from the template rows.
unmatched_note: >-
  Variables below have data in the transform specs but no matching row in the
  Table S4 template (e.g. Interleukin 18, or a combined PR/QRS/QT spec variable
  the template splits into three rows). Listed here for review; reconcile by
  adding a template row, adding an alias above, or confirming out-of-scope.
