name: HV-Lint Quality Checks

on:
  workflow_dispatch:
    inputs:
      bdchm_ref:
        description: "BDCHM schema git ref (branch/tag/SHA)"
        required: false
        default: "main"
      cohort:
        description: "Cohort to validate (ARIC, CHS, etc.) or 'all'"
        required: false
        default: "all"
      fail_on:
        description: "Minimum severity to fail (critical/error/warning/info)"
        required: false
        default: "error"

jobs:
  hv-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: "Phase 1: Schema-driven structural checks"
        run: |
          poetry run python hv-lint/validate_yaml_quality.py \
            --bdchm-ref "${{ github.event.inputs.bdchm_ref || 'main' }}" \
            --cohort "${{ github.event.inputs.cohort || 'all' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'error' }}"

      - name: "Phase 2: dbGaP cross-reference checks"
        if: always()
        run: |
          poetry run python hv-lint/validate_phv_cross_reference.py \
            --cohort "${{ github.event.inputs.cohort || 'all' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'error' }}"
