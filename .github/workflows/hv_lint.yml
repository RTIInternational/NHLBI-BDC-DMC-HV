name: HV-Lint Quality Checks

on:
  pull_request:
    paths:
      - 'priority_variables_transform/**'
      - 'hv-lint/**'
      - '.github/workflows/hv_lint.yml'
      # The release each cohort declares. It is the EXPECTATION the mandatory release check
      # compares the cache against, so a PR that bumps a version and touches nothing else
      # must run this workflow -- otherwise the one change the check exists to police is the
      # one change that never reaches it.
      - 'hv_dataqc/cache_fetcher/manifests/**'
  # main itself, after every merge, over every cohort (Detect runs on pull_request only, so the
  # config step falls back to `all`). Two PRs each green on its own base can be red together --
  # one adds the block another adds in a different file (1.12), or one fixes the finding whose
  # entry another relies on -- and without this no run shows it.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bdchm_ref:
        description: "BDCHM schema git ref (branch/tag/SHA); empty = the pinned BDCHM_REF"
        required: false
        default: ""
      cohort:
        description: "Cohort to validate (ARIC, CHS, etc.) or 'all'"
        required: false
        default: "all"
      fail_on:
        description: "Minimum severity to fail (critical/high/error/warning/info)"
        required: false
        default: "error"
      summary_limit:
        description: "Max findings shown in the run summary (default: 50)"
        required: false
        default: "50"

jobs:
  # Unit tests for the linter itself: tmp_path fixtures, the committed cache, known-case
  # fixtures, no network. Some tests read the shipped specs: COPDGene bdy_hgt.yaml and FHS
  # visit.yaml (test_visit_label_extraction.py), every *-ingest/ cohort has a
  # _manifest-<cohort>.yaml and a visit.yaml (test_cohorts.py), every id expression parses
  # (test_rule_fixes_885.py), and every known_issues.yaml entry names a file that exists
  # (test_known_issues.py). So a spec PR that adds a cohort without a declaration or a
  # visit.yaml, changes FHS visit ids, writes an id expression the enumerator cannot read, or
  # deletes a file a known issue names fails this job. ENFORCED: these pin the resolver every
  # phase manager calls to turn `--cohort` into a cache key, the shared visit-id enumerator,
  # each rule on its known cases, known_issues.yaml's schema (every entry names an issue), and
  # the fail-closed exits of the phase mains. Runs alongside hv-lint rather than after it -- a
  # lint failure must not stop the linter's own regressions from being reported.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyyaml is the only third-party import these tests reach: _cohorts is stdlib-only,
      # and the phase-1, phase-3 and phase-5 modules they exercise import yaml and nothing
      # else. The lint job's linkml-runtime is not needed here.
      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Run hv-lint unit tests
        run: python -m pytest -q hv-lint/tests/

  hv-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every package is pinned with its hashes (hv-lint/requirements-lint.txt, compiled from
      # requirements-lint.in for linux / Python 3.12): the ratchet compares findings, so a new
      # yamllint, linkml-runtime or PyYAML release must not change them under an unrelated PR.
      # linkml-map is the model Phase 2's 2.1 reads its valid keys from; without it Phase 2
      # fails in CI rather than fall back to the frozen v0.3.9 key sets (Assumption A2). 0.5.3
      # is the version the pipeline runs (A6).
      - name: Install dependencies
        run: pip install --require-hashes -r hv-lint/requirements-lint.txt

      - name: Detect changed cohort
        id: detect
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          # A change to HV-Lint itself (a rule, known_issues.yaml, warning_baseline.json) or to
          # this workflow can change the result for every cohort, and the known-issue and
          # ratchet state spans all of them, so such a PR lints `all` whatever specs it touches.
          # A diff that fails widens to `all` too, as the spec diff below already does.
          TOOLING=$(git diff --name-only "$BASE" HEAD -- hv-lint/ .github/workflows/hv_lint.yml) \
            || TOOLING="(git diff failed)"
          # Cohorts whose ingest directory changed.
          SPECS=$(git diff --name-only "$BASE" HEAD -- priority_variables_transform/ \
            | { grep -- '-ingest/' || true; } \
            | sed 's|priority_variables_transform/\([^/]*\)-ingest/.*|\1|')
          # A changed `_manifest-<cohort>.yaml` changes that cohort's declared release, so in a
          # PR that also edits specs it counts as a change to that cohort: editing ARIC specs
          # and bumping MESA's release must not lint ARIC only. `_cohorts.canonical_cohort`
          # maps the declaration name to its ingest directory (hchs_sol -> HCHS); a name it
          # cannot map stays distinct, which widens the run to `all` rather than narrowing it.
          # With no spec change, CHANGED stays empty and the run is `all`, as before.
          DECLS=""
          CANON='import sys; sys.path.insert(0, "hv-lint"); import _cohorts;'
          CANON="$CANON print(_cohorts.canonical_cohort(sys.argv[1]))"
          if [ -n "$SPECS" ]; then
            DECLS=$(git diff --name-only "$BASE" HEAD -- hv_dataqc/cache_fetcher/manifests/ \
              | sed -n 's|.*/_manifest-\(.*\)\.yaml$|\1|p' \
              | while read -r name; do python -c "$CANON" "$name"; done)
          fi
          CHANGED=$(printf '%s\n%s\n' "$SPECS" "$DECLS" \
            | { grep -v '^$' || true; } \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')
          if [ -n "$TOOLING" ] || [ -z "$CHANGED" ]; then
            echo "cohort=all" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$CHANGED" | tr ',' '\n' | wc -l)" -gt 1 ]; then
            echo "cohort=all" >> "$GITHUB_OUTPUT"
          else
            echo "cohort=$CHANGED" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected cohort: $(cat "$GITHUB_OUTPUT" | grep cohort)"

      - name: Set cohort variable
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cohort=${{ github.event.inputs.cohort || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "fail_on=${{ github.event.inputs.fail_on || 'error' }}" >> "$GITHUB_OUTPUT"
            echo "bdchm_ref=${{ github.event.inputs.bdchm_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "cohort=${{ steps.detect.outputs.cohort || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "fail_on=error" >> "$GITHUB_OUTPUT"
            echo "bdchm_ref=" >> "$GITHUB_OUTPUT"
          fi

      # Every phase is ENFORCED: a finding at or above --fail-on (ERROR on pull requests) fails
      # the job. Main stays green through hv-lint/known_issues.yaml -- one entry per known
      # finding, keyed by fingerprint and naming its issue and status -- not through advisory
      # steps. An entry that no longer matches fails too (rule KI), and so does any WARNING
      # fingerprint added to or gone from hv-lint/warning_baseline.json (rule RATCHET). After a
      # fix: HVLINT_PRUNE=1 python hv-lint/run_all.py --cohort all.
      # Each step runs `if: always()` so one failing phase still reports the others, and
      # `exit "${PIPESTATUS[0]}"` keeps tee from masking the exit code.
      - name: "Phase 1: YAML structural & formatting checks"
        id: phase1
        run: |
          python hv-lint/phase-1/run_phase1.py \
            --cohort "${{ steps.config.outputs.cohort }}" \
            --fail-on "${{ steps.config.outputs.fail_on }}" \
            2>&1 | tee phase1-output.txt
          exit "${PIPESTATUS[0]}"

      - name: "Phase 2: BDC-HM model conformance + PHV deduplication 2.8"
        id: phase2
        if: always()
        run: |
          # The schema ref is pinned in phase-2/validate_model_conformance.py (BDCHM_REF);
          # a manual run may override it.
          BDCHM_REF="${{ steps.config.outputs.bdchm_ref }}"
          python hv-lint/phase-2/run_phase2.py \
            ${BDCHM_REF:+--bdchm-ref "$BDCHM_REF"} \
            --cohort "${{ steps.config.outputs.cohort }}" \
            --fail-on "${{ steps.config.outputs.fail_on }}" \
            2>&1 | tee phase2-output.txt
          exit "${PIPESTATUS[0]}"

      - name: "Phase 3: dbGaP cross-reference + semantic + status checks"
        id: phase3
        if: always()
        run: |
          python hv-lint/phase-3/run_phase3.py \
            --cohort "${{ steps.config.outputs.cohort }}" \
            --fail-on "${{ steps.config.outputs.fail_on }}" \
            2>&1 | tee phase3-output.txt
          exit "${PIPESTATUS[0]}"

      - name: "Phase 5: Visit structure validation"
        id: phase5
        if: always()
        run: |
          python hv-lint/phase-5/run_phase5.py \
            --cohort "${{ steps.config.outputs.cohort }}" \
            --fail-on "${{ steps.config.outputs.fail_on }}" \
            2>&1 | tee phase5-output.txt
          exit "${PIPESTATUS[0]}"

      # The icon is each phase step's own outcome (its exit code), not a grep of its log: a log
      # can print both PASSED and FAILED (one component of a phase passes, another fails).
      - name: Publish step summary
        if: always()
        env:
          OUTCOME_1: ${{ steps.phase1.outcome }}
          OUTCOME_2: ${{ steps.phase2.outcome }}
          OUTCOME_3: ${{ steps.phase3.outcome }}
          OUTCOME_5: ${{ steps.phase5.outcome }}
        run: |
          COHORT="${{ steps.config.outputs.cohort }}"
          LIMIT="${{ github.event.inputs.summary_limit || '50' }}"

          echo "## HV-Lint Results -- ${COHORT}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for phase in 1 2 3 5; do
            f="phase${phase}-output.txt"
            if [ -f "$f" ]; then
              var="OUTCOME_${phase}"
              case "${!var}" in
                success) ICON="white_check_mark" ;;
                failure) ICON="x" ;;
                *) ICON="question" ;;
              esac

              echo "### :${ICON}: Phase ${phase}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '<details><summary>Click to expand output</summary>' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n "$LIMIT" "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '</details>' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Every known_issues.yaml entry, warning_baseline.json row and removed.yaml line the PR
      # adds over its merge base (what `git diff origin/<base>...HEAD` shows), so a reviewer
      # sees "this PR silences N findings" without reading those files' diffs. fetch-depth: 0
      # above makes origin/<base> and the merge base available.
      - name: Silencing summary
        if: always() && github.event_name == 'pull_request'
        run: |
          python hv-lint/silencing_summary.py --base "origin/${{ github.base_ref }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-lint-findings
          path: |
            phase1-output.txt
            phase2-output.txt
            phase3-output.txt
            phase5-output.txt
          if-no-files-found: ignore
