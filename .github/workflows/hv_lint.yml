name: HV-Lint Quality Checks

on:
  workflow_dispatch:
    inputs:
      bdchm_ref:
        description: "BDCHM schema git ref (branch/tag/SHA)"
        required: false
        default: "main"
      cohort:
        description: "Cohort to validate (ARIC, CHS, etc.) or 'all'"
        required: false
        default: "all"
      fail_on:
        description: "Minimum severity to fail (critical/high/error/warning/info)"
        required: false
        default: "error"
      summary_limit:
        description: "Max findings shown in the run summary (default: 50)"
        required: false
        default: "50"

jobs:
  hv-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: "Phase 1: Schema-driven structural checks"
        run: |
          poetry run python hv-lint/validate_yaml_quality.py \
            --bdchm-ref "${{ inputs.bdchm_ref }}" \
            --cohort "${{ inputs.cohort }}" \
            --fail-on "${{ inputs.fail_on }}" \
            --summary-file phase1-summary.md \
            --summary-limit "${{ inputs.summary_limit }}"

      - name: "Phase 2: dbGaP cross-reference checks"
        if: always()
        run: |
          poetry run python hv-lint/validate_phv_cross_reference.py \
            --cohort "${{ inputs.cohort }}" \
            --fail-on "${{ inputs.fail_on }}" \
            --summary-file phase2-summary.md \
            --summary-limit "${{ inputs.summary_limit }}"

      - name: Publish step summary
        if: always()
        run: |
          for f in phase1-summary.md phase2-summary.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload full findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-lint-findings
          path: |
            phase1-summary.md
            phase2-summary.md
          if-no-files-found: ignore
