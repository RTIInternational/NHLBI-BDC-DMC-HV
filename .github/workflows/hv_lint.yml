name: HV-Lint Quality Checks

on:
  workflow_dispatch:
    inputs:
      bdchm_ref:
        description: "BDCHM schema git ref (branch/tag/SHA)"
        required: false
        default: "main"
      cohort:
        description: "Cohort to validate (ARIC, CHS, etc.) or 'all'"
        required: false
        default: "all"
      fail_on:
        description: "Minimum severity to fail (critical/high/error/warning/info)"
        required: false
        default: "error"
      summary_limit:
        description: "Max findings shown in the run summary (default: 50)"
        required: false
        default: "50"

jobs:
  hv-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: "Phase 1: YAML structural & formatting checks"
        id: phase1
        run: |
          poetry run python hv-lint/phase-1/run_phase1.py \
            --cohort "${{ github.event.inputs.cohort || 'all' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'error' }}" \
            2>&1 | tee phase1-output.txt

      - name: "Phase 2: BDC-HM model conformance checks"
        id: phase2
        if: always()
        run: |
          poetry run python hv-lint/phase-2/run_phase2.py \
            --bdchm-ref "${{ github.event.inputs.bdchm_ref || 'main' }}" \
            --cohort "${{ github.event.inputs.cohort || 'all' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'error' }}" \
            2>&1 | tee phase2-output.txt

      - name: "Phase 3: dbGaP cross-reference checks"
        id: phase3
        if: always()
        run: |
          poetry run python hv-lint/phase-3/run_phase3.py \
            --cache-dir hv-lint/dbgap-cache \
            --cohort "${{ github.event.inputs.cohort || 'all' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'error' }}" \
            2>&1 | tee phase3-output.txt

      - name: Publish step summary
        if: always()
        run: |
          echo "## HV-Lint Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for phase in 1 2 3; do
            f="phase${phase}-output.txt"
            if [ -f "$f" ]; then
              echo "### Phase $phase" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -30 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload full findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-lint-findings
          path: |
            phase1-output.txt
            phase2-output.txt
            phase3-output.txt
          if-no-files-found: ignore
