name: Validate study guide TSVs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "study_guide_VT/**"
  pull_request:
    paths:
      - "study_guide_VT/**"

jobs:
  validate-study-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate study_guide_VT/*.tsv
        run: python study_guide_VT/validate_study_guides.py
