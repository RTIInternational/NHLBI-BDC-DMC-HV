# fhs_albumin_bld_b0: copied verbatim from HV main 731984f5 as a fixed test case for #885.
class_derivations:
  MeasurementObservation:
    populated_from: pht000030
    slot_derivations:
      associated_participant:
        expr: uuid5("https://w3id.org/bdchm/Participant", str({phv00007675}) + ":FHS")
      associated_visit:
        expr: uuid5("https://w3id.org/bdchm/Visit", str({phv00007675}) + ":FHS OFFSPRING EXAM 1")
      age_at_observation:
        expr: '{pht003099.phv00177930} * 365'
      observation_type:
        value: OBA:VT0000199
        range: string
      method_type:
        value: blood assay
      value_quantity:
        class_derivations:
        - Quantity:
            populated_from: pht000030
            slot_derivations:
              value_decimal:
                populated_from: phv00007562
              unit:
                value: g/dL
                range: string
