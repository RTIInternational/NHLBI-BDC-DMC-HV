      associated_visit:
        expr: uuid5("https://w3id.org/bdchm/Visit", str({phv00274708}) + ":FHS ORIGINAL EXAM 32")
      age_at_observation:
        expr: '{pht003099.phv00227008} * 365'
      observation_type:
        value: OBA:VT0001253
