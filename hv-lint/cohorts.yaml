# HV-Lint Cohort Configuration
# =============================
# Minimal version pins for dbGaP data fetching and index building.
# Update entries here when a cohort's dbGaP version is bumped.
#
# To add a new cohort:
#   1. Add an entry below with study_id and data_version
#   2. Run: python hv-lint/update_data.py --cohort <key>
#
# The key (e.g. "aric") must match the directory name used under
# dbgap-cache/ and the --cohort argument to lint phases.

cohorts:
  aric:
    study_id: phs000280
    data_version: v8.p2
    display_name: "Atherosclerosis Risk in Communities (ARIC)"

  cardia:
    study_id: phs000285
    data_version: v3.p2
    display_name: "Coronary Artery Risk Development in Young Adults (CARDIA)"

  chs:
